};

/* ================= 11.4 La bàn tang ================= */
MOUNTS.tangent = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="480" height="400"></canvas>',
    side:
      UI.panel("Cuộn dây",
        UI.num("N", "Số vòng dây N", "vòng", { v: 10, min: 1, max: 1000, step: 1, smin: 1, smax: 50 }) +
        UI.num("R", "Bán kính cuộn dây R", "cm", { v: 10, min: 1, max: 100, step: 0.5, smin: 5, smax: 20 }) +
        UI.num("I", "Cường độ dòng điện I", "A", { v: 0.5, min: 0, max: 10, step: 0.01, smin: 0, smax: 1 })) +
      UI.panel("Điều khiển", UI.acts([["rec", "Ghi số liệu", 1], ["flip", "⇄ Đảo chiều dòng"]]) + '<div class="msg"></div>') +
      UI.panel("Số đo", UI.vals([["th", "Góc lệch kim θ", "°"], ["dr", "Chiều dòng điện", ""], ["stt", "Kim", ""]])),
    below: UI.graphs([["gt", "Góc lệch của kim theo thời gian θ(t)"]]) + UI.data(UI.acts([["rv", "Hiện B_h thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const Bh = (3.6 + Math.random() * 0.8) * 1e-5;
  const lg = Log(q(".lg"), ["N", "R (cm)", "I (A)", "Chiều", "θ (°)", "B_h = μ₀NI/(2R·tanθ) (T)"]);
  const GT = K.graph("gt", { series: [{ label: "θ (°)", color: "red" }, { label: "θ cân bằng", color: "muted", width: 1, dash: [4, 4], head: false }], yLabel: "θ (°)", window: 10 });
  let sgn = 1, thetaMeas = 0, phi = 0, om = 0, T = 0;
  const Bc = () => MU0 * K.v("N") * K.v("I") / (2 * K.v("R") / 100);
  const thEq = () => Math.atan2(sgn * Bc(), Bh);
  function update(){ const th = Math.abs(thEq()) * 180 / Math.PI; thetaMeas = K.v("I") === 0 ? 0 : Math.round(th + gauss() * 0.4); K.out("dr", sgn > 0 ? "thuận (lệch Đông)" : "ngược (lệch Tây)"); }
  const settled = () => Math.abs(om) < 0.03 && Math.abs(phi - thEq()) < 0.01;
  function draw(){
    g.clearRect(0, 0, 480, 400); const cx = 240, cy = 210, rc = 100, bc = Bc();
    g.fillStyle = C.ink; g.font = F(14, 700); g.textAlign = "center"; g.fillText("B", cx, 24); g.font = F(12); g.fillStyle = C.muted; g.fillText("(Bắc từ)", cx, 40);
    g.fillText("Đ", cx + rc + 40, cy + 4); g.fillText("T", cx - rc - 40, cy + 4);
    const half = Math.min(K.v("R"), 24) * 6.5; g.fillStyle = C.wood; g.fillRect(cx - 7, cy - half, 14, 2 * half);
    g.font = F(11); g.fillText("cuộn dây (nhìn từ trên)", cx + 90, Math.min(cy + half + 14, 392));
    g.fillStyle = C.gaugeBg; g.strokeStyle = C.line; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, rc * 0.62, 0, 2 * Math.PI); g.fill(); g.stroke();
    g.fillStyle = C.muted; g.font = F(10); g.fillText("N", cx, cy - rc * 0.62 + 14);
    const L = rc * 0.52, ux = Math.sin(phi), uy = -Math.cos(phi);
    g.lineCap = "round"; g.lineWidth = 8; g.strokeStyle = C.red; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + ux * L, cy + uy * L); g.stroke();
    g.strokeStyle = C.muted; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx - ux * L, cy - uy * L); g.stroke(); g.lineCap = "butt";
    g.fillStyle = C.ink; g.beginPath(); g.arc(cx, cy, 4, 0, 2 * Math.PI); g.fill();
    const k = 60; arrow(g, cx, cy, cx, cy - k, C.blue, 2.5); g.fillStyle = C.blue; g.font = F(12, 600); g.textAlign = "left"; g.fillText("B_h", cx + 6, cy - k - 4);
    const bl = Math.min(k * bc / Bh, 150);
    if (bc > 0) { arrow(g, cx, cy, cx + sgn * bl, cy, C.green, 2.5); g.fillStyle = C.green; g.fillText("B_c", cx + sgn * bl + (sgn > 0 ? 4 : -28), cy - 8); arrow(g, cx, cy, cx + sgn * bl, cy - k, C.purple, 2); }
  }
  root._redraw = draw;
  /* Kim nam châm: dao động tắt dần quanh hướng của từ trường tổng hợp */
  loop(root, dt => {
    T += dt; const r = sgn * Bc() / Bh, n = 4;
    /* mômen ∝ m×B; chuẩn hoá theo |B| để tần số dao động của kim ổn định (ω₀² ≈ 26 s⁻²) */
    for (let i = 0; i < n; i++) { const h = dt / n, acc = -26 * (Math.sin(phi) - r * Math.cos(phi)) / Math.hypot(1, r) - 2.2 * om; om += acc * h; phi += om * h; }
    K.out("th", (phi * 180 / Math.PI).toFixed(1)); K.out("stt", settled() ? "đã đứng yên" : "đang dao động");
    GT.push(T, [phi * 180 / Math.PI, thEq() * 180 / Math.PI]); draw();
  });
  K.on("*", update);
  q(".flip").onclick = () => { sgn = -sgn; update(); };
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "B_h trung bình = <b>" + (mean(d.map(r => r.b)) * 1e5).toFixed(2) + "×10⁻⁵ T</b>, ΔB_h = " + (meanDev(d.map(r => r.b)) * 1e5).toFixed(2) + "×10⁻⁵ T" : ""; }
  q(".rec").onclick = () => {
    if (K.v("I") <= 0 || thetaMeas < 1) { q(".msg").textContent = "Cần có dòng điện để kim lệch."; return; }
    if (!settled()) { q(".msg").textContent = "Kim chưa đứng yên – chờ kim ổn định rồi ghi."; return; }
    q(".msg").textContent = "";
    const N = K.v("N"), R = K.v("R"), I = K.v("I"), b = MU0 * N * I / (2 * R / 100 * Math.tan(thetaMeas * Math.PI / 180));
    lg.add([N, R, I.toFixed(2), sgn > 0 ? "thuận" : "ngược", thetaMeas, (b * 1e5).toFixed(2) + "×10⁻⁵"], { b }); showMean(); update();
  };
  q(".clr").onclick = () => { lg.clear(); showMean(); };
  q(".rv").onclick = () => { const d = lg.data(), m = d.length ? mean(d.map(r => r.b)) : null; q(".tr").innerHTML = '<span class="ok">B_h thật (mô hình) = ' + (Bh * 1e5).toFixed(2) + "×10⁻⁵ T</span>" + (m ? "<br>Sai số tương đối: " + (Math.abs(m - Bh) / Bh * 100).toFixed(1) + " %" : ""); };
  update();
};

<script>
"use strict";
/* Bộ tích phân dùng chung (như module integrators của PhysSandbox) */
function rk4Pendulum(th, om, h, w2){
  const f = (a, b) => [b, -w2 * Math.sin(a)];
  const k1 = f(th, om), k2 = f(th + h / 2 * k1[0], om + h / 2 * k1[1]), k3 = f(th + h / 2 * k2[0], om + h / 2 * k2[1]), k4 = f(th + h * k3[0], om + h * k3[1]);
  return [th + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), om + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])];
}
/* Chu kì con lắc đơn biên độ lớn (khai triển chuỗi) */
const pendulumPeriod = (L, g, th0) => 2 * Math.PI * Math.sqrt(L / g) * (1 + th0 * th0 / 16 + 11 / 3072 * th0 ** 4 + 173 / 737280 * th0 ** 6);

/* ================= 12.1 Con lắc đơn / con lắc lò xo ================= */
function mountOsc(root, mode){
  const P = mode === "pendulum";
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="480" height="380"></canvas>',
    side:
      UI.panel(P ? "Con lắc đơn" : "Con lắc lò xo",
        (P ? UI.num("x", "Chiều dài dây l", "cm", { v: 50, min: 5, max: 500, step: 1, smin: 20, smax: 100 }) +
             UI.num("A", "Biên độ góc ban đầu θ₀", "°", { v: 8, min: 1, max: 90, step: 1, smin: 2, smax: 30 })
           : UI.num("x", "Khối lượng vật m", "g", { v: 100, min: 10, max: 5000, step: 5, smin: 50, smax: 300 }) +
             UI.num("A", "Biên độ ban đầu A", "cm", { v: 2, min: 0.5, max: 10, step: 0.1, smin: 1, smax: 5 })) +
        UI.num("n", "Số dao động cần đếm n", "", { v: 10, min: 1, max: 100, step: 1, smin: 5, smax: 30 }) +
        UI.num("sp", "Tốc độ tua nhanh", "×", { v: 4, min: 0.25, max: 20, step: 0.25, smin: 1, smax: 8 })) +
      UI.panel("Điều khiển", UI.acts([["go", "▶ Thả & đo", 1], ["ps", "⏸ Tạm dừng", 0, 1], ["rs", "↺ Đặt lại"], ["rec", "Ghi vào bảng", 0, 1]]) + '<div class="msg"></div>') +
      UI.panel("Số đo", UI.vals([["t", "Đồng hồ", "s"], ["c", "Đã đếm", "dao động"], [P ? "x1" : "x1", P ? "Li độ góc θ" : "Li độ x", P ? "°" : "cm"]])),
    below: UI.graphs(P ? [["g1", "Li độ góc theo thời gian θ(t)"], ["g2", "Vận tốc góc theo thời gian ω(t)"]] : [["g1", "Li độ theo thời gian x(t)"], ["g2", "Vận tốc theo thời gian v(t)"]]) +
      UI.data('<canvas class="ch" width="520" height="260"></canvas><div class="res fit"></div>' + UI.acts([["rv", "Hiện giá trị thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const gTrue = 9.78 + gauss() * 0.04, kTrue = 15 + Math.random() * 10, ms = 0.02;
  const lg = Log(q(".lg"), [P ? "l (cm)" : "m (g)", P ? "θ₀ (°)" : "A (cm)", "n", "t (s)", "T = t/n (s)", "T² (s²)"]);
  const G1 = K.graph("g1", { series: [{ label: P ? "θ (°)" : "x (cm)", color: "blue" }], yLabel: P ? "θ (°)" : "x (cm)", window: 12, sym: true });
  const G2 = K.graph("g2", { series: [{ label: P ? "ω (rad/s)" : "v (cm/s)", color: "orange" }], yLabel: P ? "ω (rad/s)" : "v (cm/s)", window: 12, sym: true });
  let running = false, paused = false, swinging = false, tt = 0, tTrue = 0, tMeas = null, done = false, th = 0, om = 0, Tcur = 1;
  const xv = () => K.v("x"), n = () => K.v("n");
  const wSpring = () => Math.sqrt(kTrue / (xv() / 1000 + ms / 3));
  const Tof = () => P ? pendulumPeriod(xv() / 100, gTrue, K.v("A") * Math.PI / 180) : 2 * Math.PI / wSpring();
  function state0(){ th = P ? K.v("A") * Math.PI / 180 : K.v("A"); om = 0; }
  function stepPhys(h){
    if (P) { const w2 = gTrue / (xv() / 100), m = Math.max(1, Math.ceil(h / 0.002)); for (let i = 0; i < m; i++) [th, om] = rk4Pendulum(th, om, h / m, w2); }
    else { const w = wSpring(), A = K.v("A"); th = A * Math.cos(w * tt); om = -A * w * Math.sin(w * tt); }
  }
  function draw(){
    g.clearRect(0, 0, 480, 380); g.fillStyle = C.surface; g.fillRect(140, 14, 200, 8);
    g.strokeStyle = C.line; g.lineWidth = 1; for (let x = 146; x < 340; x += 12) { g.beginPath(); g.moveTo(x, 14); g.lineTo(x - 6, 6); g.stroke(); }
    if (P) {
      const sc = Math.min(3, 320 / xv()), L = xv() * sc, px = 240, py = 22, bx = px + L * Math.sin(th), by = py + L * Math.cos(th);
      g.setLineDash([3, 4]); g.strokeStyle = C.muted; g.beginPath(); g.moveTo(px, py); g.lineTo(px, py + L + 20); g.stroke(); g.setLineDash([]);
      g.strokeStyle = C.muted; g.globalAlpha = .6; g.beginPath(); g.arc(px, py, Math.min(L, 60), Math.PI / 2 - K.v("A") * Math.PI / 180, Math.PI / 2 + K.v("A") * Math.PI / 180); g.stroke(); g.globalAlpha = 1;
      g.strokeStyle = C.ink2; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px, py); g.lineTo(bx, by); g.stroke();
      g.fillStyle = C.blue; g.beginPath(); g.arc(bx, by, 14, 0, 2 * Math.PI); g.fill();
      if (Math.abs(om) > 0.02) arrow(g, bx, by, bx + Math.cos(th) * om * L * 0.18, by - Math.sin(th) * om * L * 0.18, C.orange, 2.5);
      g.fillStyle = C.ink; g.font = F(12, 600); g.fillText("l = " + xv() + " cm   θ₀ = " + K.v("A") + "°", 16, 44);
    } else {
      const m = xv() / 1000, ext = Math.min(150, m * gTrue / kTrue * 600), y = 22 + 80 + ext + Math.min(60, 9 * th), px = 240;
      g.strokeStyle = C.ink2; g.lineWidth = 2; g.beginPath(); g.moveTo(px, 22);
      const segs = 14, y0 = 40; g.lineTo(px, y0);
      for (let i = 1; i <= segs; i++) g.lineTo(px + (i % 2 ? 14 : -14), y0 + (y - 20 - y0) * i / segs);
      g.lineTo(px, y - 20); g.stroke();
      const sz = 22 + Math.min(m, 1) * 60; g.fillStyle = C.blue; g.fillRect(px - sz / 2, y - 20, sz, sz); g.fillStyle = "#fff"; g.font = F(11, 600); g.textAlign = "center"; g.fillText(xv() + " g", px, y - 20 + sz / 2 + 4); g.textAlign = "left";
      g.setLineDash([3, 4]); g.strokeStyle = C.muted; g.lineWidth = 1; const ye = 22 + 80 + ext + sz / 2 - 20; g.beginPath(); g.moveTo(px + 50, ye); g.lineTo(px + 120, ye); g.stroke(); g.setLineDash([]);
      g.fillStyle = C.muted; g.font = F(11); g.fillText("VTCB", px + 124, ye + 4);
    }
  }
  function out(){
    K.out("t", done ? tMeas.toFixed(2) : tt.toFixed(2)); K.out("c", done ? n() : Math.min(n(), Math.floor(tt / Tcur)));
    K.out("x1", P ? (th * 180 / Math.PI).toFixed(2) : th.toFixed(2));
  }
  function reset(){ running = false; paused = false; swinging = false; tt = 0; tMeas = null; done = false; state0(); q(".rec").disabled = true; q(".go").disabled = false; q(".ps").disabled = true; q(".ps").textContent = "⏸ Tạm dừng"; q(".msg").textContent = ""; G1.clear(); G2.clear(); out(); draw(); }
  loop(root, dt => {
    if (!swinging || paused) return;
    const h = dt * K.v("sp"); tt += h; stepPhys(h);
    if (running) {
      if (tt >= tTrue) { running = false; done = true; tMeas = Math.max(0.01, rnd(tTrue + gauss() * 0.04, 0.01)); q(".rec").disabled = false; q(".go").disabled = false; q(".msg").textContent = "Đã đếm đủ " + n() + " dao động. Con lắc vẫn dao động – bấm “Đặt lại” để dừng."; }
      G1.push(tt, [P ? th * 180 / Math.PI : th]); G2.push(tt, [om]);
    }
    out(); draw();
  });
  q(".go").onclick = () => { reset(); Tcur = Tof(); tTrue = n() * Tcur * (1 + gauss() * 0.002); running = true; swinging = true; q(".go").disabled = true; q(".ps").disabled = false; };
  q(".ps").onclick = () => { if (!swinging) return; paused = !paused; q(".ps").textContent = paused ? "▶ Tiếp tục" : "⏸ Tạm dừng"; };
  q(".rs").onclick = reset;
  K.on(["x", "A", "n"], reset);
  function refresh(){
    const d = lg.data(), pts = d.map(r => ({ x: r.xs, y: r.T2 })), f = lineFit(pts);
    plotXY(q(".ch"), pts, P ? "l (m)" : "m (kg)", "T² (s²)", f, P ? 1 : 0.3, P ? 4 : 1);
    q(".fit").innerHTML = f ? "Hệ số góc = " + f.b.toFixed(3) + " s²/" + (P ? "m" : "kg") + " → " + (P ? "g = 4π²/hệ số góc = <b>" + (4 * Math.PI * Math.PI / f.b).toFixed(2) + "</b> m/s²" : "k = 4π²/hệ số góc = <b>" + (4 * Math.PI * Math.PI / f.b).toFixed(1) + "</b> N/m") : "Cần ít nhất 2 lần đo với giá trị khác nhau để vẽ đường khớp T².";
  }
  root._redraw = () => { draw(); refresh(); };
  q(".rec").onclick = () => {
    if (!done) return; const T = tMeas / n(), xs = P ? xv() / 100 : xv() / 1000;
    lg.add([xv(), K.v("A"), n(), tMeas.toFixed(2), T.toFixed(4), (T * T).toFixed(4)], { xs, T2: T * T }); q(".rec").disabled = true; done = false; refresh();
  };
  q(".clr").onclick = () => { lg.clear(); refresh(); };
  q(".rv").onclick = () => { q(".tr").innerHTML = '<span class="ok">' + (P ? "g thật (mô hình) = " + gTrue.toFixed(3) + " m/s². Với θ₀ = " + K.v("A") + "°, chu kì lớn hơn chu kì góc nhỏ " + ((pendulumPeriod(1, 1, K.v("A") * Math.PI / 180) / (2 * Math.PI) - 1) * 100).toFixed(2) + " %." : "k thật (mô hình) = " + kTrue.toFixed(2) + " N/m, khối lượng lò xo " + (ms * 1000).toFixed(0) + " g (nên đồ thị không đi qua gốc).") + "</span>"; };
  reset(); refresh();
}
MOUNTS.pendulum = r => mountOsc(r, "pendulum");
MOUNTS.spring = r => mountOsc(r, "spring");

/* ================= 12.2 Ống cộng hưởng ================= */
MOUNTS.resonance = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="640" height="300"></canvas>',
    side:
      UI.panel("Thông số",
        UI.num("f", "Tần số nguồn âm f", "Hz", { v: 512, min: 50, max: 5000, step: 1, smin: 200, smax: 1000 }) +
        UI.num("l", "Chiều dài cột khí l", "cm", { v: 50, min: 1, max: 100, step: 0.1, smin: 5, smax: 100 })) +
      UI.panel("Ghi vị trí cộng hưởng", UI.acts([["s1", "Ghi l₁"], ["s2", "Ghi l₂"], ["rec", "Ghi vào bảng", 1]]) + '<div class="msg"></div>') +
      UI.panel("Số đo", UI.vals([["ld", "Độ to của âm", "%"], ["l1", "l₁", "cm"], ["l2", "l₂", "cm"]])),
    below: UI.graphs([["gp", "Tín hiệu micrô p(t) – dao động ký"], ["gl", "Độ to theo chiều dài cột khí (các vị trí đã quét)"]]) +
      UI.data(UI.acts([["rv", "Hiện v thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const Tair = 26 + Math.random() * 6, vTrue = 331.3 + 0.606 * Tair, rad = 2.5;
  const lg = Log(q(".lg"), ["f (Hz)", "l₁ (cm)", "l₂ (cm)", "λ = 2(l₂ − l₁) (cm)", "v = λf (m/s)"]);
  const GP = K.graph("gp", { series: [{ label: "p (đơn vị tương đối)", color: "blue" }], xLabel: "t (ms)", yLabel: "p", yRange: [-1.1, 1.1] });
  const GL = K.graph("gl", { series: [{ label: "độ to (%)", color: "green" }, { label: "vị trí hiện tại", color: "red", dots: true }], xLabel: "l (cm)", yLabel: "%", xRange: [0, 100], yRange: [0, 105] });
  const scan = new Map();
  let l1 = null, l2 = null, loud = 0, ph = 0, tv = 0;
  const fHz = () => K.v("f"), lcm = () => K.v("l");
  function amp(l){ const lam = vTrue / fHz() * 100, leff = l + 0.6 * rad, n = Math.max(1, Math.round((4 * leff / lam + 1) / 2)), d = Math.abs(leff - (2 * n - 1) * lam / 4); return 1 / (1 + Math.pow(d / 0.9, 2)); }
  function draw(A){
    g.clearRect(0, 0, 640, 300);
    const x0 = 90, ppc = 4.6, y0 = 140, xp = x0 + lcm() * ppc, lam = vTrue / fHz() * 100;
    g.fillStyle = C.metal; g.fillRect(10, y0 - 40, 24, 80); g.beginPath(); g.moveTo(34, y0 - 40); g.lineTo(x0, y0 - 24); g.lineTo(x0, y0 + 24); g.lineTo(34, y0 + 40); g.closePath(); g.fill();
    g.fillStyle = C.bg; g.font = F(11, 700); g.fillText("loa", 12, y0 + 4);
    g.strokeStyle = C.line; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, y0 - 24); g.lineTo(x0 + 100 * ppc + 14, y0 - 24); g.moveTo(x0, y0 + 24); g.lineTo(x0 + 100 * ppc + 14, y0 + 24); g.stroke();
    g.fillStyle = C.orange; g.fillRect(xp, y0 - 23, 14, 46);
    g.strokeStyle = C.blue; g.lineWidth = 2; g.globalAlpha = 0.25 + 0.7 * A;
    for (const s of [1, -1]) { g.beginPath(); for (let x = x0; x <= xp; x += 2) { const dcm = (xp - x) / ppc, yy = y0 + s * 20 * Math.min(1, A + 0.12) * Math.abs(Math.sin(2 * Math.PI * dcm / lam)) * Math.cos(ph); x === x0 ? g.moveTo(x, yy) : g.lineTo(x, yy); } g.stroke(); }
    g.globalAlpha = 1;
    g.fillStyle = C.muted; g.font = F(10); for (let c = 0; c <= 100; c += 10) { const x = x0 + c * ppc; g.fillRect(x, y0 + 30, 1, 6); g.fillText(c, x - 6, y0 + 48); }
    g.fillText("thang chia (cm) tính từ miệng ống", x0, y0 + 64);
    g.fillStyle = C.surface; g.fillRect(40, 240, 560, 22); g.fillStyle = A > 0.85 ? C.green : C.blue; g.fillRect(40, 240, 560 * A, 22); g.strokeStyle = C.line; g.lineWidth = 1; g.strokeRect(40, 240, 560, 22);
    g.fillStyle = C.ink; g.font = F(11, 600); g.fillText("độ to", 40, 234);
  }
  root._redraw = () => draw(loud);
  function scanGraph(){ const pts = [...scan.entries()].sort((a, b) => a[0] - b[0]); GL.set([pts, [[lcm(), loud * 100]]]); }
  function update(){
    loud = clamp(amp(lcm()) * (1 + gauss() * 0.02), 0, 1); K.out("ld", (loud * 100).toFixed(0));
    scan.set(+lcm().toFixed(1), loud * 100); scanGraph();
  }
  loop(root, dt => {
    ph += dt * 21; tv += dt;
    /* dao động ký: 3 chu kì, quét chậm để thấy sóng chạy */
    const T = 1000 / fHz(), pts = [], sh = tv * 0.6 * T;
    for (let i = 0; i <= 240; i++) { const t = 3 * T * i / 240; pts.push([t, loud * Math.sin(2 * Math.PI * (t + sh) / T) * (1 + 0.03 * gauss())]); }
    GP.set([pts]); draw(loud);
  });
  K.on("l", update);
  K.on("f", () => { l1 = l2 = null; K.out("l1", "—"); K.out("l2", "—"); scan.clear(); update(); });
  q(".s1").onclick = () => { l1 = rnd(lcm() + gauss() * 0.1, 0.1); K.out("l1", l1.toFixed(1)); };
  q(".s2").onclick = () => { l2 = rnd(lcm() + gauss() * 0.1, 0.1); K.out("l2", l2.toFixed(1)); };
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "v " + stat(d.map(x => x.v), 1, "m/s") : ""; }
  q(".rec").onclick = () => {
    if (l1 === null || l2 === null || l2 <= l1) { q(".msg").textContent = "Cần ghi l₁ và l₂ với l₂ > l₁ (hai vị trí cộng hưởng liên tiếp)."; return; }
    q(".msg").textContent = ""; const lam = 2 * (l2 - l1), v = lam * fHz() / 100;
    lg.add([fHz(), l1.toFixed(1), l2.toFixed(1), lam.toFixed(1), v.toFixed(1)], { v }); showMean();
  };
  q(".clr").onclick = () => { lg.clear(); showMean(); };
  q(".rv").onclick = () => { const d = lg.data(); q(".tr").innerHTML = '<span class="ok">Nhiệt độ phòng ' + Tair.toFixed(1) + " °C → v thật = " + vTrue.toFixed(1) + " m/s</span>" + (d.length ? " &nbsp; Sai số tương đối: " + (Math.abs(mean(d.map(x => x.v)) - vTrue) / vTrue * 100).toFixed(1) + " %" : ""); };
  K.out("l1", "—"); K.out("l2", "—"); update();
};

/* ================= 12.3 Mạch R–L–C nối tiếp ================= */
MOUNTS.rlc = function(root){
  setHTML(root, UI.layout({
    stage: '<div class="duo"><canvas class="scene ph" width="400" height="300"></canvas><canvas class="cu" width="400" height="300"></canvas></div>',
    side:
      UI.panel("Linh kiện & nguồn",
        UI.num("R", "Điện trở R", "Ω", { v: 50, min: 1, max: 10000, step: 1, smin: 10, smax: 200 }) +
        UI.num("L", "Độ tự cảm L", "mH", { v: 100, min: 1, max: 10000, step: 1, smin: 10, smax: 500 }) +
        UI.num("C", "Điện dung C", "μF", { v: 10, min: 0.01, max: 10000, step: 0.1, smin: 1, smax: 50 }) +
        UI.num("f", "Tần số nguồn f", "Hz", { v: 100, min: 1, max: 100000, step: 1, smin: 20, smax: 1000 }) +
        UI.num("U", "Điện áp hiệu dụng U", "V", { v: 12, min: 0.1, max: 1000, step: 0.1, smin: 1, smax: 24 })) +
      UI.panel("Điều khiển", UI.acts([["rec", "Ghi số liệu", 1], ["rv", "Hiện f cộng hưởng"]])) +
      UI.panel("Số đo (hiệu dụng)", UI.vals([["ur", "U_R", "V"], ["ul", "U_L", "V"], ["uc", "U_C", "V"], ["uu", "U", "V"], ["ii", "I", "mA"], ["phi", "Độ lệch pha φ", "°"]])),
    below: UI.graphs([["gu", "Điện áp tức thời u(t) – dao động ký"], ["gi", "Cường độ dòng điện tức thời i(t)"]]) +
      UI.data('<div class="res chk"></div>' + UI.acts([["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), gp = q(".ph").getContext("2d"), gc = q(".cu").getContext("2d");
  const lg = Log(q(".lg"), ["f (Hz)", "U_R (V)", "U_L (V)", "U_C (V)", "U (V)", "I (mA)", "Z = U/I (Ω)"]);
  const GU = K.graph("gu", { series: [{ label: "u", color: "red" }, { label: "u_R", color: "green", width: 1.5 }, { label: "u_L", color: "purple", width: 1.5 }, { label: "u_C", color: "blue", width: 1.5 }], xLabel: "t (ms)", yLabel: "u (V)", sym: true, height: 170 });
  const GI = K.graph("gi", { series: [{ label: "i (mA)", color: "orange" }], xLabel: "t (ms)", yLabel: "i (mA)", sym: true, height: 170 });
  let shown = false, cur = null, tv = 0;
  const par = () => ({ R: K.v("R"), L: K.v("L") / 1000, Cc: K.v("C") * 1e-6, f: K.v("f"), U: K.v("U") });
  function calc(f, p){ const w = 2 * Math.PI * f, XL = w * p.L, XC = 1 / (w * p.Cc), Z = Math.sqrt(p.R * p.R + (XL - XC) ** 2), I = p.U / Z; return { XL, XC, Z, I, UR: I * p.R, UL: I * XL, UC: I * XC, phi: Math.atan2(XL - XC, p.R) }; }
  const f0 = p => 1 / (2 * Math.PI * Math.sqrt(p.L * p.Cc));
  function update(){
    const p = par(), c = calc(p.f, p), n = () => 1 + gauss() * 0.005;
    cur = { f: p.f, UR: rnd(c.UR * n(), 0.01), UL: rnd(c.UL * n(), 0.01), UC: rnd(c.UC * n(), 0.01), U: rnd(p.U * n(), 0.01), I: rnd(c.I * 1000 * n(), 0.1) };
    K.out("ur", cur.UR.toFixed(2)); K.out("ul", cur.UL.toFixed(2)); K.out("uc", cur.UC.toFixed(2)); K.out("uu", cur.U.toFixed(2)); K.out("ii", cur.I.toFixed(1)); K.out("phi", (c.phi * 180 / Math.PI).toFixed(1));
    drawPhasor(c, p); drawCurve(p);
  }
  function drawPhasor(c, p){
    const g = gp; g.clearRect(0, 0, 400, 300); const ox = 60, oy = 150, k = 150 / p.U;
    g.fillStyle = C.ink; g.font = F(12, 600); g.fillText("Giản đồ véc-tơ (điện áp hiệu dụng)", 10, 20);
    g.strokeStyle = C.grid; g.lineWidth = 1; g.beginPath(); g.moveTo(ox, 30); g.lineTo(ox, 270); g.moveTo(20, oy); g.lineTo(390, oy); g.stroke();
    const ur = c.UR * k, dv = clamp((c.UL - c.UC) * k, -125, 125);
    g.font = F(12, 600);
    arrow(g, ox, oy, ox + ur, oy, C.green, 3); g.fillStyle = C.green; g.fillText("U_R", ox + ur / 2 - 8, oy + 18);
    if (Math.abs(dv) > 2) { arrow(g, ox + ur, oy, ox + ur, oy - dv, C.purple, 3); g.fillStyle = C.purple; g.fillText("U_L − U_C", ox + ur + 8, oy - dv / 2); }
    arrow(g, ox, oy, ox + ur, oy - dv, C.red, 3); g.fillStyle = C.red; g.fillText("U = " + p.U + " V", ox + ur / 2 - 20, oy - dv / 2 - 10);
    g.fillStyle = C.muted; g.font = F(11); g.fillText("trục I", ox + 300, oy - 6); g.fillText(c.phi > 0.001 ? "u sớm pha hơn i (mạch có tính cảm kháng)" : c.phi < -0.001 ? "u trễ pha hơn i (mạch có tính dung kháng)" : "u cùng pha với i (cộng hưởng)", 10, 288);
  }
  function drawCurve(p){
    const g = gc, W = 400, H = 300, L = 50, B = 36, T = 20, R = 22; g.clearRect(0, 0, W, H);
    const fr = f0(p), fmax = Math.max(1000, 2.2 * Math.max(p.f, fr)), N = 300;
    const pts = []; let Imax = 0; for (let i = 0; i <= N; i++) { const f = 1 + (fmax - 1) * i / N, I = calc(f, p).I * 1000; pts.push([f, I]); Imax = Math.max(Imax, I); }
    const X = f => L + f / fmax * (W - L - R), Y = I => H - B - I / (Imax * 1.1) * (H - B - T);
    g.lineWidth = 1; const sy = niceStep(Imax * 1.1), sx = niceStep(fmax);
    g.fillStyle = C.ink2; g.font = F(10);
    g.textAlign = "right"; for (let v = 0; v <= Imax * 1.1; v += sy) { g.strokeStyle = C.grid; g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - R, Y(v)); g.stroke(); g.fillText(fmtTick(v, Imax), L - 4, Y(v) + 3); }
    g.textAlign = "center"; for (let f = sx; f <= fmax; f += sx) g.fillText(fmtTick(f, fmax), X(f), H - B + 14);
    g.strokeStyle = C.ink2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, H - B); g.lineTo(W - R, H - B); g.stroke();
    g.fillText("f (Hz)", W / 2, H - 4); g.textAlign = "left"; g.fillText("I (mA) – đường cộng hưởng", 6, 11);
    g.strokeStyle = C.blue; g.lineWidth = 2; g.beginPath(); pts.forEach((pt, i) => i ? g.lineTo(X(pt[0]), Y(pt[1])) : g.moveTo(X(pt[0]), Y(pt[1]))); g.stroke();
    if (shown) { g.setLineDash([4, 3]); g.strokeStyle = C.red; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(fr), T); g.lineTo(X(fr), H - B); g.stroke(); g.setLineDash([]); g.fillStyle = C.red; g.fillText("f₀", X(fr) + 3, T + 10); }
    g.fillStyle = C.red; g.beginPath(); g.arc(X(p.f), Y(calc(p.f, p).I * 1000), 5, 0, 2 * Math.PI); g.fill();
  }
  root._redraw = () => { const p = par(); drawPhasor(calc(p.f, p), p); drawCurve(p); };
  /* Dao động ký: 2 chu kì, quét chậm (0,4 chu kì mỗi giây thực) */
  loop(root, dt => {
    tv += dt; const p = par(), c = calc(p.f, p), T = 1000 / p.f, w = 2 * Math.PI / T, s2 = Math.SQRT2, sh = tv * 0.4 * T;
    const u = [], ur = [], ul = [], uc = [], ii = [];
    for (let k = 0; k <= 200; k++) { const t = 2 * T * k / 200, a = w * (t + sh);
      ii.push([t, s2 * c.I * 1000 * Math.sin(a)]); ur.push([t, s2 * c.UR * Math.sin(a)]); ul.push([t, s2 * c.UL * Math.sin(a + Math.PI / 2)]); uc.push([t, s2 * c.UC * Math.sin(a - Math.PI / 2)]); u.push([t, s2 * p.U * Math.sin(a + c.phi)]); }
    GU.set([u, ur, ul, uc]); GI.set([ii]);
  });
  K.on("*", k => { if (k !== "f" && k !== "U") shown = false; update(); });
  q(".rec").onclick = () => {
    const z = cur.U / (cur.I / 1000); lg.add([cur.f, cur.UR.toFixed(2), cur.UL.toFixed(2), cur.UC.toFixed(2), cur.U.toFixed(2), cur.I.toFixed(1), z.toFixed(1)], {});
    const rhs = Math.sqrt(cur.UR ** 2 + (cur.UL - cur.UC) ** 2);
    q(".chk").innerHTML = "Kiểm tra lần ghi gần nhất: U = " + cur.U.toFixed(2) + " V; √[U_R² + (U_L − U_C)²] = <b>" + rhs.toFixed(2) + "</b> V (sai lệch " + (Math.abs(rhs - cur.U) / cur.U * 100).toFixed(1) + " %)";
  };
  q(".clr").onclick = () => { lg.clear(); q(".chk").textContent = ""; };
  q(".rv").onclick = () => { const p = par(); shown = true; q(".tr").innerHTML = '<span class="ok">f₀ = 1/(2π√LC) = ' + f0(p).toFixed(1) + " Hz</span>"; drawCurve(p); };
  update();
};

MOUNTS.young = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="600" height="150"></canvas><p class="hint">Màn rộng 50 mm. Đặt vạch đỏ và vạch xanh vào tâm hai vân sáng, đếm số khoảng vân k giữa chúng.</p>',
    side:
      UI.panel("Nguồn sáng & khe",
        UI.sel("las", "Laser", [["0", "Đỏ"], ["1", "Lục"], ["2", "Lam"]], "0") +
        UI.num("a", "Khoảng cách hai khe a", "mm", { v: 0.3, min: 0.01, max: 5, step: 0.01, smin: 0.1, smax: 1 }) +
        UI.num("D", "Khoảng cách khe – màn D", "m", { v: 1.5, min: 0.1, max: 10, step: 0.01, smin: 0.5, smax: 3 })) +
      UI.panel("Thước đo trên màn",
        UI.num("y1", "Vạch đỏ y₁", "mm", { v: 0, min: -25, max: 25, step: 0.1 }) +
        UI.num("y2", "Vạch xanh y₂", "mm", { v: 10, min: -25, max: 25, step: 0.1 }) +
        UI.num("k", "Số khoảng vân k giữa hai vạch", "", { v: 3, min: 1, max: 100, step: 1, smin: 1, smax: 30 }) + UI.acts([["rec", "Ghi vào bảng", 1]])) +
      UI.panel("Số đo", UI.vals([["dy", "Δy = |y₂ − y₁|", "mm"], ["iv", "i = Δy / k", "mm"]])),
    below: UI.graphs([["gI", "Phân bố cường độ sáng trên màn I(y)"]]) + UI.data(UI.acts([["rv", "Hiện λ thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const lamNom = [630 + Math.random() * 30, 515 + Math.random() * 25, 440 + Math.random() * 25], tint = [[255, 30, 30], [40, 255, 60], [60, 90, 255]], col = ["#ff4d4d", "#3ddc6a", "#5a7dff"];
  const lg = Log(q(".lg"), ["a (mm)", "D (m)", "i (mm)", "λ = a·i/D (nm)"]);
  const GI = K.graph("gI", { series: [{ label: "I (tương đối)", color: col[0], width: 1.5 }, { label: "y₁", color: "#ff3b30", dots: true }, { label: "y₂", color: "#2f9bff", dots: true }], xLabel: "y (mm)", yLabel: "I", xRange: [-25, 25], yRange: [0, 1.08], height: 170 });
  const pxmm = 12, W = 600, off = document.createElement("canvas"); off.width = W; off.height = 100; const og = off.getContext("2d");
  const lam = () => lamNom[+K.v("las")];
  const iTrue = () => lam() * 1e-9 * K.v("D") / (K.v("a") * 1e-3) * 1e3;
  const Iy = (y, i) => Math.pow(Math.cos(Math.PI * y / i), 2) * Math.exp(-Math.pow(y / 24, 2));
  function draw(){
    const i = iTrue(), tn = tint[+K.v("las")];
    g.clearRect(0, 0, W, 150); g.fillStyle = "#000"; g.fillRect(0, 0, W, 100);
    const img = og.createImageData(W, 100);
    for (let x = 0; x < W; x++) { const I = Iy((x - W / 2) / pxmm, i); for (let r = 0; r < 100; r++) { const o = (r * W + x) * 4; img.data[o] = tn[0] * I; img.data[o + 1] = tn[1] * I; img.data[o + 2] = tn[2] * I; img.data[o + 3] = 255; } }
    og.putImageData(img, 0, 0); g.drawImage(off, 0, 0, W, 100);
    g.fillStyle = C.surface; g.fillRect(0, 100, W, 50); g.fillStyle = C.ink; g.font = F(10);
    for (let m = -25; m <= 25; m++) { const x = W / 2 + m * pxmm; g.fillRect(x, 100, 1, m % 5 === 0 ? 14 : 7); if (m % 5 === 0) g.fillText(m, x - 6, 126); }
    g.fillStyle = C.muted; g.fillText("y (mm), 0 ở vân sáng trung tâm", 10, 144);
    [[K.v("y1"), "#ff3b30"], [K.v("y2"), "#2f9bff"]].forEach(m => { const x = W / 2 + m[0] * pxmm; g.strokeStyle = m[1]; g.lineWidth = 2; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 150); g.stroke(); });
    const pts = []; for (let k = 0; k <= 1000; k++) { const y = -25 + 50 * k / 1000; pts.push([y, Iy(y, i)]); }
    GI.series[0].color = col[+K.v("las")]; GI.set([pts, [[K.v("y1"), Iy(K.v("y1"), i)]], [[K.v("y2"), Iy(K.v("y2"), i)]]]);
  }
  root._redraw = draw;
  function update(){ const dy = Math.abs(K.v("y2") - K.v("y1")); K.out("dy", dy.toFixed(1)); K.out("iv", (dy / Math.max(1, K.v("k"))).toFixed(3)); draw(); }
  K.on("*", update);
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "λ " + stat(d.map(x => x.l), 0, "nm") : ""; }
  q(".rec").onclick = () => {
    const dy = Math.abs(K.v("y2") - K.v("y1")), k = Math.max(1, Math.round(K.v("k"))); if (dy < 0.5) return;
    const i = dy / k, l = K.v("a") * i / K.v("D") * 1e3; lg.add([K.v("a").toFixed(2), K.v("D").toFixed(2), i.toFixed(3), l.toFixed(0)], { l }); showMean();
  };
  q(".clr").onclick = () => { lg.clear(); showMean(); };
  q(".rv").onclick = () => { const d = lg.data(); q(".tr").innerHTML = '<span class="ok">Bước sóng thật của laser này = ' + lam().toFixed(0) + " nm</span>" + (d.length ? " &nbsp; Sai số tương đối: " + (Math.abs(mean(d.map(x => x.l)) - lam()) / lam() * 100).toFixed(1) + " %" : ""); };
  update();
};

let CUR = null;           // mô phỏng đang chạy: { e, idx, root, flush }
let HOME = { grade: "all", q: "" };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase();
const href = e => "#/lop-" + e.grade + "/" + e.slug;
const byGrade = g => EXPS.filter(e => e.grade === g);
const simCount = EXPS.reduce((n, e) => n + e.sims.length, 0);

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- Thẻ bài thực hành ---------- */
function expCard(e){
  return '<a class="ecard" href="' + href(e) + '" style="--c:' + GRADES[e.grade].color + '">' +
    '<div class="ehead"><span class="eicon">' + e.icon + '</span><span class="eno">' + e.no + "</span></div>" +
    "<h3>" + esc(e.title) + "</h3><p>" + esc(e.short) + "</p>" +
    '<div class="etags"><span class="tag">' + esc(e.tag) + "</span>" +
    (e.sims.length > 1 ? '<span class="tag">' + e.sims.length + " mô phỏng</span>" : "") + "</div>" +
    '<span class="open">Mở thí nghiệm →</span></a>';
}
function gradeCard(g){
  const m = GRADES[g], list = byGrade(g);
  return '<a class="gcard" href="#/lop-' + g + '" style="--c:' + m.color + '">' +
    '<div class="gtop"><div class="gicon">' + m.icon + '</div><div class="gcount"><b>' + list.length + "</b>bài</div></div>" +
    "<h3>" + m.name + " · " + m.topic + "</h3><p>" + m.desc + "</p>" +
    '<div class="gtopics">' + [...new Set(list.map(e => e.tag))].map(t => '<span class="tag">' + t + "</span>").join("") + "</div>" +
    '<span class="more">Khám phá →</span></a>';
}

/* ---------- Trang chủ ---------- */
function viewHome(){
  document.title = "Thí nghiệm Vật lý – Thực hành thí nghiệm Vật lí 10, 11, 12";
  app.innerHTML =
    '<section class="hero">' +
      '<span class="pill"><span class="dot"></span>' + EXPS.length + " bài thực hành · " + simCount + " mô phỏng tương tác</span>" +
      '<h1>Vật lí <span class="grad">sống động</span><br>ngay trên trình duyệt</h1>' +
      '<p class="lead">Thực hành các bài thí nghiệm trong chương trình Vật lí 10, 11, 12: kéo, chỉnh, đo, ghi bảng số liệu và vẽ đồ thị – số liệu có sai số ngẫu nhiên như phép đo thật.</p>' +
      '<div class="cta"><a class="btn primary" href="#/lop-10">Bắt đầu với Lớp 10 →</a><button class="btn ghost" type="button" data-scroll="all">Xem tất cả bài</button></div>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + EXPS.length + "</b><span>Bài thực hành</span></div>" +
        '<div class="stat"><b>' + simCount + "</b><span>Mô phỏng</span></div>" +
        '<div class="stat"><b>3</b><span>Khối lớp</span></div>' +
        '<div class="stat"><b>100%</b><span>Miễn phí</span></div>' +
      "</div></section>" +
    '<section class="sec"><h2 class="sec-title">Chọn khối lớp</h2><p class="sec-sub">Mỗi khối lớp gồm các bài thực hành theo danh mục chương trình – từ động học đến quang học sóng.</p>' +
      '<div class="grade-grid">' + [10, 11, 12].map(gradeCard).join("") + "</div></section>" +
    '<section class="sec" id="all"><div class="sec-head"><div><h2 class="sec-title">Tất cả bài thực hành</h2><p class="sec-sub">Mỗi bài có mục tiêu, các bước làm, mô phỏng, bảng số liệu, phương trình chính và câu hỏi thường gặp.</p></div>' +
      '<div class="toolbar"><div class="chips" role="group" aria-label="Lọc theo lớp">' +
        [["all", "Tất cả"], ["10", "Lớp 10"], ["11", "Lớp 11"], ["12", "Lớp 12"]].map(c => '<button class="chip" type="button" data-g="' + c[0] + '" aria-pressed="' + (HOME.grade === c[0]) + '">' + c[1] + "</button>").join("") +
      '</div><label class="search"><input type="search" placeholder="Tìm bài, ví dụ: thấu kính" aria-label="Tìm bài thực hành" value="' + esc(HOME.q) + '"></label></div></div>' +
      '<div class="exp-grid" id="grid"></div></section>' +
    "";
  const grid = app.querySelector("#grid"), input = app.querySelector(".search input");
  const paint = () => {
    const q = norm(HOME.q.trim());
    const list = EXPS.filter(e => (HOME.grade === "all" || String(e.grade) === HOME.grade) && (!q || norm(e.no + " " + e.title + " " + e.short + " " + e.tag).includes(q)));
    grid.innerHTML = list.length ? list.map(expCard).join("") : '<div class="empty">Không tìm thấy bài phù hợp với “' + esc(HOME.q) + "”.</div>";
  };
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { HOME.grade = b.dataset.g; app.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); paint(); });
  input.oninput = () => { HOME.q = input.value; paint(); };
  app.querySelector("[data-scroll=all]").onclick = () => app.querySelector("#all").scrollIntoView({ behavior: "smooth" });
  paint();
}

/* ---------- Trang khối lớp ---------- */
function viewGrade(g){
  const m = GRADES[g], list = byGrade(g);
  document.title = m.name + " – " + m.topic + " | Thí nghiệm Vật lý";
  app.innerHTML =
    '<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Trang chủ</a><span>/</span><span>' + m.name + "</span></nav>" +
    '<header class="page-head" style="--c:' + m.color + '"><div class="gicon">' + m.icon + "</div><div>" +
      '<div class="etags"><span class="tag">' + list.length + ' bài thực hành</span><span class="tag">' + list.reduce((n, e) => n + e.sims.length, 0) + " mô phỏng</span></div>" +
      "<h1>" + m.name + " · " + m.topic + "</h1><p>" + m.desc + "</p></div></header>" +
    '<section class="sec" style="padding-top:18px"><div class="exp-grid">' + list.map(expCard).join("") + "</div></section>";
}

/* ---------- Trang bài thực hành ---------- */
function viewExp(e, query){
  const m = GRADES[e.grade], i = EXPS.indexOf(e), prev = EXPS[i - 1], next = EXPS[i + 1];
  const simIdx = clamp(parseInt(query.get("sim"), 10) || 0, 0, e.sims.length - 1);
  document.title = e.no + " " + e.title + " | Thí nghiệm Vật lý";
  app.innerHTML =
    '<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Trang chủ</a><span>/</span><a href="#/lop-' + e.grade + '">' + m.name + "</a><span>/</span><span>Bài " + e.no + "</span></nav>" +
    '<header class="exp-head" style="--c:' + m.color + '"><div class="eicon">' + e.icon + "</div><div>" +
      '<div class="etags"><span class="eno">' + e.no + '</span><span class="tag">' + esc(e.tag) + "</span>" + (e.sims.length > 1 ? '<span class="tag">' + e.sims.length + " mô phỏng</span>" : "") + "</div>" +
      "<h1>" + esc(e.title) + '</h1><p class="lead">' + esc(e.goal) + "</p></div></header>" +
    '<section class="simwrap" aria-label="Mô phỏng"><div class="simbar">' +
      (e.sims.length > 1 ? '<div class="simtabs" role="tablist">' + e.sims.map((s, k) => '<button type="button" role="tab" data-i="' + k + '">' + esc(s.label) + "</button>").join("") + "</div>"
                         : '<div class="simtitle"><span class="live"></span>' + esc(e.sims[0].label) + "</div>") +
      '<div class="tools"><button type="button" data-tool="share" title="Sao chép đường dẫn kèm cấu hình hiện tại">🔗 Chia sẻ cấu hình</button><button type="button" data-tool="csv" title="Tải bảng số liệu dạng CSV">⬇ Xuất CSV</button><button type="button" data-tool="fs" title="Toàn màn hình">⛶ Toàn màn hình</button></div>' +
    '</div><div class="simbox"></div>' +
    '</section>' +
    '<div class="info-grid">' +
      '<section class="panel"><h2>🧪 Các bước thực hiện</h2><ol class="steps">' + e.steps.map(s => "<li>" + esc(s) + "</li>").join("") + "</ol></section>" +
      '<section class="panel"><h2>∑ Phương trình chính</h2><div class="eqs">' + e.eqs.map(q => '<div class="eq"><span>' + esc(q[0]) + "</span><code>" + esc(q[1]) + "</code></div>").join("") + "</div></section>" +
    "</div>" +
    '<section class="panel"><h2>🎯 Nguồn sai số &amp; mẹo đo chính xác</h2><ul class="tips">' + e.tips.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></section>" +
    '<section class="panel faq"><h2>❓ Câu hỏi thường gặp</h2>' + e.faq.map(f => "<details><summary>" + esc(f[0]) + "</summary><p>" + esc(f[1]) + "</p></details>").join("") + "</section>" +
    '<nav class="pager" aria-label="Bài khác">' +
      (prev ? '<a href="' + href(prev) + '"><small>← Bài trước</small>' + prev.no + " · " + esc(prev.title) + "</a>" : "") +
      (next ? '<a class="nx" href="' + href(next) + '"><small>Bài tiếp →</small>' + next.no + " · " + esc(next.title) + "</a>" : "") +
    "</nav>";
  app.querySelectorAll(".simtabs button").forEach(b => b.onclick = () => mountSim(e, +b.dataset.i, new URLSearchParams()));
  app.querySelector("[data-tool=share]").onclick = shareSetup;
  app.querySelector("[data-tool=csv]").onclick = exportCSV;
  app.querySelector("[data-tool=fs]").onclick = toggleFS;
  mountSim(e, simIdx, query);
}

/* ---------- Gắn mô phỏng + đồng bộ thông số với URL ---------- */
function mountSim(e, idx, query){
  const box = app.querySelector(".simbox");
  app.querySelectorAll(".simtabs button").forEach((b, k) => b.setAttribute("aria-selected", k === idx));
  box.innerHTML = "";
  const root = document.createElement("div"); root.className = "custom"; box.appendChild(root);
  MOUNTS[e.sims[idx].custom](root);
  const fields = root._K ? [...root._K.fields] : [];
  const defs = new Map(fields.map(([k, f]) => [k, f.str()]));
  query.forEach((v, k) => { if (k === "sim") return; const f = root._K && root._K.fields.get(k); if (!f) return; const x = f.parse(v); if (x !== null) f.set(x); });
  let timer = 0;
  const write = () => {
    timer = 0; const p = new URLSearchParams();
    if (idx) p.set("sim", idx);
    fields.forEach(([k, f]) => { const v = f.str(); if (v !== defs.get(k)) p.set(k, v); });
    const qs = p.toString(), url = href(e) + (qs ? "?" + qs : "");
    if (url !== location.hash) { try { history.replaceState(null, "", url); } catch (_) {} }
  };
  root.addEventListener("param", () => { clearTimeout(timer); timer = setTimeout(write, 200); });
  CUR = { e, idx, root, flush(){ if (timer) { clearTimeout(timer); write(); } } };
  write();
}

/* ---------- Công cụ: chia sẻ, CSV, toàn màn hình ---------- */
async function shareSetup(){
  if (!CUR) return; CUR.flush();
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast("Đã sao chép đường dẫn kèm cấu hình"); }
  catch (_) { window.prompt("Sao chép đường dẫn này:", url); }
}
function exportCSV(){
  if (!CUR) return;
  const lines = [];
  CUR.root.querySelectorAll("table.dt").forEach(t => {
    const rows = [...t.querySelectorAll("tr")]; if (rows.length < 2) return;
    rows.forEach(r => lines.push([...r.children].map(c => '"' + c.textContent.replace(/"/g, '""') + '"').join(",")));
    lines.push("");
  });
  if (!lines.length) { toast("Bảng số liệu đang trống – hãy ghi vài lần đo trước"); return; }
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "bai-" + CUR.e.no + "-" + CUR.e.slug + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Đã xuất bảng số liệu");
}
function toggleFS(){
  const w = app.querySelector(".simwrap"); if (!w) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (w.requestFullscreen) w.requestFullscreen().catch(() => toast("Trình duyệt không cho phép toàn màn hình"));
  else toast("Trình duyệt không hỗ trợ toàn màn hình");
}

/* ---------- Giao diện sáng / tối ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("vla-theme", t); } catch (_) {}
  syncPalette();
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  themeBtn.title = t === "dark" ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện tối";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0c1222" : "#f5f7fb");
  if (CUR && CUR.root.isConnected && CUR.root._redraw) CUR.root._redraw();
  GRAPHS.forEach(gr => gr.draw());
}
themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ---------- Bộ định tuyến ---------- */
function parseHash(){ const h = location.hash.replace(/^#/, "") || "/"; const k = h.indexOf("?"); return { path: k < 0 ? h : h.slice(0, k), query: new URLSearchParams(k < 0 ? "" : h.slice(k + 1)) }; }
function view404(){
  document.title = "Không tìm thấy | Thí nghiệm Vật lý";
  app.innerHTML = '<section class="notfound"><h1 class="sec-title">Không tìm thấy trang</h1><p class="sec-sub">Đường dẫn không đúng hoặc bài thực hành đã đổi tên.</p><a class="btn primary" href="#/">Về trang chủ</a></section>';
}
function route(){
  const { path, query } = parseHash(), seg = path.split("/").filter(Boolean);
  CUR = null; let nav = "home";
  if (!seg.length) viewHome();
  else {
    const m = /^lop-(10|11|12)$/.exec(seg[0]);
    if (!m) { view404(); nav = ""; }
    else {
      nav = m[1];
      if (seg.length === 1) viewGrade(+m[1]);
      else { const e = EXPS.find(x => x.grade === +m[1] && x.slug === seg[1]); e ? viewExp(e, query) : view404(); }
    }
  }
  document.querySelectorAll(".nav a").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");
route();
/* Vẽ lại canvas khi phông chữ web đã tải xong */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (CUR && CUR.root.isConnected && CUR.root._redraw) CUR.root._redraw(); GRAPHS.forEach(gr => gr.draw()); });
</script>
