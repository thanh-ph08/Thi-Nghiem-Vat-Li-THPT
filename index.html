<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thí nghiệm Vật lý – Thực hành thí nghiệm Vật lý 10, 11, 12</title>
<meta name="description" content="13 bài thực hành Vật lí lớp 10, 11, 12 với mô phỏng tương tác: đo đạc, ghi bảng số liệu, vẽ đồ thị và tính sai số ngay trên trình duyệt.">
<meta name="theme-color" content="#0c1222">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1222'/%3E%3Cg fill='none' stroke='%2300bfff' stroke-width='3'%3E%3Cellipse cx='32' cy='32' rx='24' ry='9'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='9' transform='rotate(60 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='9' transform='rotate(120 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='4' fill='%2300bfff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
/* Chọn giao diện trước khi vẽ trang để tránh nháy màu */
(function(){ var t = null; try { t = localStorage.getItem("vla-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* ================= Design tokens ================= */
:root{color-scheme:dark;
  --bg:#0c1222;--bg-soft:#0f1830;--card:#111a2f;--card-2:#16213b;--ink:#e7edf7;--ink-2:#c3cde0;--muted:#8a97b0;--line:#223052;--line-2:#2f3f66;
  --accent:#00bfff;--accent-2:#7c5cff;--accent-ink:#00151f;--accent-soft:rgba(0,191,255,.12);
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--canvas:#080b10;--lcd-bg:#050b16;--lcd:#8be9ff;--lcd-strong:#fff;
  --glow1:rgba(0,191,255,.10);--glow2:rgba(124,92,255,.10);--shadow:0 14px 34px -16px rgba(0,0,0,.7);
  --cv-ink:#e6edf7;--cv-ink2:#aab6cc;--cv-muted:#76839c;--cv-grid:rgba(255,255,255,.07);--cv-line:#8b98b4;--cv-surface:#1b2640;--cv-bg:#080b10;
  --cv-blue:#4f8cff;--cv-red:#ff5f56;--cv-green:#34d399;--cv-purple:#b18cff;--cv-orange:#f5a524;--cv-wood:#c08a52;--cv-woodDark:#7a5228;
  --cv-water:rgba(56,152,255,.22);--cv-waterLine:#4aa3ff;--cv-film:rgba(120,190,255,.35);--cv-metal:#9aa3b5;--cv-gaugeBg:#0b1322;--cv-gaugeInk:#8be9ff;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme=light]{color-scheme:light;
  --bg:#f5f7fb;--bg-soft:#eef2f9;--card:#fff;--card-2:#f7f9fd;--ink:#141b2d;--ink-2:#35405a;--muted:#5b667e;--line:#dde3ef;--line-2:#c9d2e4;
  --accent:#0072c6;--accent-2:#6d4aff;--accent-ink:#fff;--accent-soft:rgba(0,114,198,.10);
  --ok:#0f7a55;--warn:#a85a05;--bad:#c0251e;--canvas:#fff;--lcd-bg:#0f1830;--lcd:#bfe3ff;
  --glow1:rgba(0,150,255,.10);--glow2:rgba(124,92,255,.08);--shadow:0 14px 34px -18px rgba(20,30,60,.28);
  --cv-ink:#1c2333;--cv-ink2:#444c5e;--cv-muted:#7a8395;--cv-grid:#edf0f6;--cv-line:#445066;--cv-surface:#e9edf5;--cv-bg:#fff;
  --cv-blue:#2457d6;--cv-red:#c0251e;--cv-green:#12805c;--cv-purple:#7a3fd1;--cv-orange:#b45f06;--cv-wood:#b9824a;--cv-woodDark:#6a4620;
  --cv-water:#cfe6ff;--cv-waterLine:#5aa0e6;--cv-film:rgba(100,170,240,.38);--cv-metal:#6b6b6b;--cv-gaugeBg:#f4f4f4;--cv-gaugeInk:#111}

/* ================= Base ================= */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 560px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(900px 520px at -10% 5%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.01em;font-family:var(--head)}
:root{--head:"Lexend","Plus Jakarta Sans",system-ui,sans-serif}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--card-2);color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= Header ================= */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:18px;white-space:nowrap;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--accent-soft)}
.nav a[aria-current=page]{color:var(--ink);background:var(--accent-soft)}
.actions{margin-left:auto;display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
@media(max-width:640px){.brand{font-size:15px}.nav{margin-left:0}.nav a{padding:7px 9px;font-size:13px}}

/* ================= Buttons / chips ================= */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -10px var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line-2);color:var(--ink);background:var(--card)}
.btn.ghost:hover{border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13px;color:var(--ink-2)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.eno{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}

/* ================= Home ================= */
.hero{text-align:center;padding:64px 0 36px}
.hero h1{font-size:clamp(34px,6.2vw,64px);font-weight:800;margin:18px 0 14px;letter-spacing:-.03em}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:17px;max-width:720px;margin:0 auto}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 34px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:0 auto}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--accent);line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.hero{padding-top:40px}}
.sec{padding:34px 0}
.sec-title{font-size:clamp(24px,3.2vw,32px);font-weight:800;margin:0 0 6px}
.sec-sub{color:var(--muted);margin:0 0 20px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-head .sec-sub{margin:0}
.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.grade-grid{grid-template-columns:1fr}}
.gcard{position:relative;overflow:hidden;display:block;padding:22px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 18%,transparent),transparent 60%),var(--card);transition:transform .18s,border-color .18s,box-shadow .18s}
.gcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:var(--shadow)}
.gtop{display:flex;justify-content:space-between;align-items:center}
.gicon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.gcount{font-size:13px;color:var(--muted)}.gcount b{font-size:22px;color:var(--ink);margin-right:3px}
.gcard h3{font-size:22px;margin:16px 0 4px}
.gcard p{color:var(--muted);font-size:14px;margin:0 0 14px}
.gtopics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.more{color:var(--c);font-weight:600;font-size:14px;filter:brightness(1.25)}
:root[data-theme=light] .more{filter:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:260px;max-width:100%;padding:9px 12px 9px 34px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.search::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--muted);font-size:17px}
@media(max-width:640px){.search,.search input{width:100%}}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ecard{display:flex;flex-direction:column;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:transform .18s,border-color .18s,box-shadow .18s;min-height:230px}
.ecard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:var(--shadow)}
.ehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.eicon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.ecard h3{font-size:16px;margin:0 0 6px}
.ecard p{color:var(--muted);font-size:13.5px;margin:0 0 12px;flex:1}
.etags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.open{margin-top:14px;font-size:13px;font-weight:600;color:var(--accent)}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line-2);border-radius:16px}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.feat-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.feat-grid{grid-template-columns:1fr}}
.feat{padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.feat .fi{font-size:22px}
.feat h3{font-size:15px;margin:8px 0 4px}
.feat p{font-size:13.5px;color:var(--muted);margin:0}

/* ================= Grade page ================= */
.page-head{padding:34px 0 10px;display:flex;gap:18px;align-items:center}
.page-head .gicon{width:64px;height:64px;font-size:32px;border-radius:18px;flex:none}
.page-head h1{font-size:clamp(26px,4vw,38px);margin:4px 0}
.page-head p{margin:0;color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted);padding-top:22px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--accent)}

/* ================= Experiment page ================= */
.exp-head{display:flex;gap:18px;align-items:flex-start;padding:16px 0 20px}
.exp-head .eicon{width:64px;height:64px;font-size:32px;border-radius:18px;flex:none}
.exp-head h1{font-size:clamp(22px,3.4vw,34px);margin:8px 0 8px;font-weight:800}
.exp-head .lead{margin:0;font-size:15.5px;max-width:880px}
@media(max-width:640px){.exp-head .eicon{display:none}}
.simwrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.simwrap:fullscreen{overflow:auto;border-radius:0;padding:18px;background:var(--bg)}
.simbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.simtabs{display:flex;gap:6px;flex-wrap:wrap}
.simtabs button{border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);border-radius:10px;padding:7px 13px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.simtabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.simtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.simtitle .live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);border-radius:10px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tools button:hover{border-color:var(--accent);color:var(--ink)}
.info-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.info-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:16px}
.info-grid .panel{margin-top:0}
.panel h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.steps{list-style:none;counter-reset:s;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px;font-size:14.5px;color:var(--ink-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:28px;bottom:2px;width:1px;background:var(--line-2)}
.eqs{display:grid;gap:8px}
.eq{border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:9px 12px}
.eq span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.eq code{font-family:var(--mono);font-size:14px;color:var(--ink)}
.tips{margin:0;padding-left:18px}.tips li{font-size:14.5px;color:var(--ink-2);margin:5px 0}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--card-2);margin:8px 0}
.faq summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;color:var(--accent);font-weight:700}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0;padding:0 14px 12px;font-size:14px;color:var(--ink-2)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.pager a{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .nx{text-align:right;grid-column:2}
@media(max-width:560px){.pager{grid-template-columns:1fr}.pager .nx{grid-column:1}}

/* ================= Simulator internals ================= */
.simbox{border-radius:14px}
.custom{padding:2px}
.sim-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,1fr);gap:14px;align-items:start}
@media(max-width:860px){.sim-grid{grid-template-columns:1fr}}
canvas{width:100%;height:auto;background:var(--canvas);border:1px solid var(--line);border-radius:12px;display:block;touch-action:none}
svg.circuit{width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:12px;display:block}
svg.circuit .w{stroke:var(--cv-ink2);fill:none;stroke-width:2}
svg.circuit .r{stroke:var(--cv-red)}
svg.circuit .m{fill:var(--canvas)}
svg.circuit text{fill:var(--cv-ink);font-family:var(--font);font-size:12px}
.ctrl{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ctrl label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 2px}
.ctrl label:first-child{margin-top:2px}
.ctrl label b{color:var(--accent);font-family:var(--mono);font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.ctrl input[type=number],.ctrl select{width:100%;margin-top:4px;padding:7px 9px;border:1px solid var(--line-2);border-radius:9px;font:inherit;font-size:14px;background:var(--card);color:var(--ink)}
.ctrl input[type=checkbox]{accent-color:var(--accent);margin-right:6px;vertical-align:-2px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
button.act{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s,transform .05s}
button.act:hover:not(:disabled){filter:brightness(1.1)}
button.act:active:not(:disabled){transform:translateY(1px)}
button.act.alt{background:transparent;color:var(--ink);border-color:var(--line-2);font-weight:500}
button.act.alt:hover:not(:disabled){border-color:var(--accent);filter:none}
button.act:disabled{opacity:.45;cursor:default}
.readout{background:var(--lcd-bg);color:var(--lcd);border:1px solid color-mix(in srgb,var(--lcd) 22%,transparent);border-radius:10px;padding:9px 12px;font-family:var(--mono);font-size:13.5px;margin:8px 0;box-shadow:inset 0 0 18px rgba(0,191,255,.06)}
.readout b{color:var(--lcd-strong);text-shadow:0 0 8px color-mix(in srgb,var(--lcd) 60%,transparent)}
:root[data-theme=light] .readout b{color:#fff}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:center}
table.dt th:last-child,table.dt td:last-child{border-right:0}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt th{background:var(--card-2);font-weight:600;color:var(--ink-2)}
table.dt tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--card-2) 55%,transparent)}
.lg{overflow-x:auto}
.res{font-size:13.5px;margin-top:10px;color:var(--ink-2)}
.res b{color:var(--ink)}
.res .ok,.ok{color:var(--ok);font-weight:600}
.msg{font-size:12.5px;color:var(--warn);min-height:18px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ================= Bộ linh kiện mô phỏng (theo bố cục PhysSandbox) ================= */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:16px;align-items:start}
.stage{grid-column:1;grid-row:1;min-width:0}
.side{grid-column:2;grid-row:1/span 2;display:grid;gap:12px;min-width:0}
.below{grid-column:1;grid-row:2;display:grid;gap:12px;min-width:0}

   ===================================================================== */
const C = {};
const CV_KEYS = ["ink", "ink2", "muted", "grid", "line", "surface", "bg", "blue", "red", "green", "purple", "orange", "wood", "woodDark", "water", "waterLine", "film", "metal", "gaugeBg", "gaugeInk"];

const F = (px, w) => (w ? w + " " : "") + px + "px " + FF;
const FM = (px, w) => (w ? w + " " : "") + px + "px " + FMONO;

function hidpi(root){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  root.querySelectorAll("canvas").forEach(cv => {
    if (cv._lw) return;
    const w = +cv.getAttribute("width"), h = +cv.getAttribute("height");
    cv._lw = w; cv._lh = h;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
  });
}
function setHTML(root, html){ root.innerHTML = html; hidpi(root); }

const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const MU0 = 4 * Math.PI * 1e-7, G_STD = 9.8;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const meanDev = a => { const m = mean(a); return mean(a.map(x => Math.abs(x - m))); };
const rnd = (x, step) => Math.round(x / step) * step;
const stat = (a, d, unit) => a.length ? "Trung bình = <b>" + mean(a).toFixed(d) + "</b> " + unit + " &nbsp; Δ = <b>" + meanDev(a).toFixed(d) + "</b> " + unit : "";

function Log(el, heads, max){
  max = max || 12;
  const items = [];
  el.innerHTML = '<table class="dt"><thead><tr><th>Lần</th>' + heads.map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody></tbody></table>";
  const tb = el.querySelector("tbody");
  const draw = () => { tb.innerHTML = items.map((it, i) => "<tr><td>" + (i + 1) + "</td>" + it.c.map(x => "<td>" + x + "</td>").join("") + "</tr>").join(""); };
  return {
    add(c, d){ if (items.length >= max) return false; items.push({ c, d }); draw(); return true; },
    clear(){ items.length = 0; draw(); },
    data(){ return items.map(i => i.d); }
  };
}

function lineFit(pts){
  const n = pts.length; if (n < 2) return null;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  pts.forEach(p => { sx += p.x; sy += p.y; sxx += p.x * p.x; sxy += p.x * p.y; });
  const d = n * sxx - sx * sx; if (Math.abs(d) < 1e-12) return null;
  const b = (n * sxy - sx * sy) / d;
  return { a: (sy - b * sx) / n, b };
}
function niceStep(max){ const raw = max / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function plotXY(cv, pts, xl, yl, fit, xr, yr){
  const g = cv.getContext("2d"), W = cv._lw || cv.width, H = cv._lh || cv.height, L = 58, B = 40, T = 12, R = 14;
  g.clearRect(0, 0, W, H);
  const xmax = Math.max(xr || 0, ...pts.map(p => p.x)) * 1.12 || 1, ymax = Math.max(yr || 0, ...pts.map(p => p.y)) * 1.12 || 1;
  const X = v => L + v / xmax * (W - L - R), Y = v => H - B - v / ymax * (H - B - T);
  g.font = F(11); g.fillStyle = C.ink2; g.lineWidth = 1;
  const sx = niceStep(xmax), sy = niceStep(ymax);
  const dx = Math.max(0, -Math.floor(Math.log10(sx))), dy = Math.max(0, -Math.floor(Math.log10(sy)));
  g.textAlign = "right";
  for (let v = 0; v <= ymax + 1e-9; v += sy) { g.strokeStyle = C.grid; g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - R, Y(v)); g.stroke(); g.fillText(v.toFixed(dy), L - 5, Y(v) + 4); }
  g.textAlign = "center";
  for (let v = 0; v <= xmax + 1e-9; v += sx) { g.strokeStyle = C.grid; g.beginPath(); g.moveTo(X(v), T); g.lineTo(X(v), H - B); g.stroke(); g.fillText(v.toFixed(dx), X(v), H - B + 14); }
  g.strokeStyle = C.ink2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, H - B); g.lineTo(W - R, H - B); g.stroke();
  g.fillText(xl, W / 2, H - 6); g.save(); g.translate(12, H / 2); g.rotate(-Math.PI / 2); g.fillText(yl, 0, 0); g.restore();
  if (fit) { g.strokeStyle = C.red; g.lineWidth = 2; g.beginPath(); g.moveTo(X(0), Y(fit.a)); g.lineTo(X(xmax), Y(fit.a + fit.b * xmax)); g.stroke(); g.lineWidth = 1; }
  g.fillStyle = C.blue; pts.forEach(p => { g.beginPath(); g.arc(X(p.x), Y(p.y), 4.5, 0, 2 * Math.PI); g.fill(); });
  g.textAlign = "left";
}
function arrow(g, x1, y1, x2, y2, col, w){
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = w || 2.5;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);

}

   tips:["Trong mô phỏng thanh được coi là nhẹ; với thanh thật cần kể đến trọng lực của thanh đặt ở trọng tâm.","Xác định vị trí treo quả cân chính xác đến 1 mm.","Thanh chỉ thật sự nằm ngang khi tổng mômen bằng 0 – tinh chỉnh điểm đỡ từng 0,5 cm."],
   faq:[["Điểm đặt hợp lực gần lực nào hơn?","Gần lực lớn hơn, vì d₁/d₂ = F₂/F₁."],["Vì sao số chỉ lực kế không đổi khi dịch điểm đỡ?","Ở trạng thái cân bằng theo phương thẳng đứng, lực kế luôn cân bằng tổng trọng lượng F₁ + F₂; vị trí điểm đỡ chỉ quyết định thanh có quay hay không."]],
   sims:[{label:"Hợp lực của hai lực song song",custom:"parallel"}] },
 { grade:10, no:"10.5", slug:"cang-mat-ngoai", icon:"💧", tag:"Chất lỏng",
   title:"Khảo sát hiện tượng căng mặt ngoài – Xác định hệ số căng mặt ngoài",
   short:"Kéo vòng khuyên ra khỏi mặt chất lỏng, đo lực lớn nhất và tính hệ số căng mặt ngoài σ.",
   goal:"Dùng lực kế nhạy đo lực lớn nhất để nhấc vòng khuyên ra khỏi mặt chất lỏng, từ đó tính hệ số căng mặt ngoài σ.",
   steps:["Chọn chất lỏng, nhiệt độ và kích thước vòng (D₁, D₂).","Bấm “Kéo vòng lên” và theo dõi số chỉ lực kế cùng đồ thị F(t).","Ghi lực lớn nhất F_max trước khi màng chất lỏng đứt.","Tính σ = F_max / [π(D₁ + D₂)].","Lặp lại 5 lần, tính giá trị trung bình và sai số."],
   eqs:[["Lực căng mặt ngoài","F_c = σ·L"],["Chiều dài đường giới hạn (hai mép vòng)","L = π(D₁ + D₂)"],["Hệ số căng mặt ngoài","σ = F_max / [π(D₁ + D₂)]"]],
   tips:["Lực kế đã trừ trọng lượng vòng; F_max chỉ là phần do màng chất lỏng tạo ra.","Vòng phải nằm ngang và sạch dầu mỡ – một chút xà phòng làm σ giảm mạnh.","σ giảm khi nhiệt độ tăng; ghi lại nhiệt độ chất lỏng khi đo."],
   faq:[["Vì sao chiều dài đường giới hạn là π(D₁ + D₂)?","Màng chất lỏng bám cả mép ngoài (chu vi πD₁) và mép trong (chu vi πD₂) của vòng."],["Vì sao xà phòng làm giảm σ?","Phân tử xà phòng tập trung ở mặt thoáng, làm yếu lực hút giữa các phân tử nước ở lớp bề mặt."]],
   sims:[{label:"Căng mặt ngoài",custom:"surface"}] },
 { grade:11, no:"11.1", slug:"luc-tu-cam-ung-dien-tu", icon:"🧲", tag:"Điện từ",
   title:"Lực từ và cảm ứng điện từ",
   short:"Đo lực từ lên đoạn dây mang dòng điện và quan sát suất điện động cảm ứng khi nam châm chuyển động.",
   goal:"Phần A: khảo sát độ lớn và chiều lực từ tác dụng lên đoạn dây mang dòng điện trong từ trường đều. Phần B: quan sát hiện tượng cảm ứng điện từ.",
   steps:["Phần A: thay đổi B, I, chiều dài l và góc α; đọc lực từ F; kiểm tra F = B·I·l·sinα và xác định chiều lực bằng quy tắc bàn tay trái.","Phần B: kéo nam châm ra vào cuộn dây (hoặc bấm “Tự động”), quan sát kim điện kế, bóng đèn và đồ thị Φ(t), e(t); thay đổi chu kì chuyển động, số vòng dây N, độ mạnh và cực nam châm."],
   eqs:[["Lực từ lên đoạn dây (Ampère)","F = B·I·l·sinα"],["Từ thông qua cuộn dây","Φ = N·B·S·cosα"],["Định luật Faraday","e = −ΔΦ / Δt"],["Định luật Lenz","dòng cảm ứng chống lại sự biến thiên từ thông"]],
   tips:["Từ trường chỉ đều ở vùng giữa hai cực; đặt đoạn dây ở giữa khe nam châm.","Đảo chiều dòng điện để kiểm tra chiều lực và loại bỏ sai số do từ trường dư.","Ở phần B, suất điện động phụ thuộc tốc độ biến thiên từ thông chứ không phụ thuộc vị trí nam châm."],
   faq:[["Vì sao F = 0 khi α = 0°?","Khi dây song song với đường sức từ, sinα = 0 nên lực từ triệt tiêu."],["Vì sao di chuyển nam châm nhanh thì đèn sáng hơn?","ΔΦ/Δt lớn hơn nên suất điện động cảm ứng lớn hơn; tăng số vòng dây N cũng cho kết quả tương tự."]],
   sims:[{label:"Phần A: Lực từ lên đoạn dây",custom:"magforce"},{label:"Phần B: Cảm ứng điện từ",custom:"induction"}] },
 { grade:11, no:"11.2", slug:"tieu-cu-thau-kinh", icon:"🔍", tag:"Quang hình",
   title:"Bộ thí nghiệm quang hình – Đo tiêu cự của thấu kính",
   short:"Dịch màn tìm ảnh rõ nét, đo d và d′ rồi tính tiêu cự thấu kính hội tụ.",
   goal:"Bố trí vật sáng, thấu kính hội tụ và màn; đo khoảng cách vật – ảnh để xác định tiêu cự f.",
   steps:["Chọn một thấu kính (bấm “Đổi thấu kính” để lấy thấu kính khác), đặt vật cách thấu kính d.","Di chuyển màn đến khi ảnh rõ nét, đọc d′.","Tính f = d·d′/(d + d′).","Kiểm tra phương pháp Silbermann: khi d = d′ = 2f thì khoảng cách vật – ảnh L = 4f.","Lặp lại với nhiều giá trị d, lấy trung bình f."],
   eqs:[["Công thức thấu kính","1/f = 1/d + 1/d′"],["Tiêu cự","f = d·d′ / (d + d′)"],["Số phóng đại","k = −d′ / d"],["Phương pháp Silbermann","d = d′ = 2f ⇒ L = 4f"]],
   tips:["Ảnh “rõ nét” trong một khoảng nhỏ (độ sâu ảnh) – dịch màn tới lui, lấy vị trí giữa.","Đo d, d′ từ quang tâm thấu kính, không phải từ mép giá đỡ.","Chọn d trong khoảng 1,5f – 3f để d′ không quá lớn, giảm sai số."],
   faq:[["Vì sao khi d ≤ f không hứng được ảnh trên màn?","Khi đó thấu kính hội tụ cho ảnh ảo (d ≤ f), không hứng được trên màn."],["Vì sao khoảng cách vật – ảnh luôn ≥ 4f?","Với ảnh thật, L = d + d′ = d²/(d − f), có giá trị nhỏ nhất 4f tại d = 2f."]],
   sims:[{label:"Đo tiêu cự thấu kính hội tụ",custom:"lens"}] },
 { grade:11, no:"11.3", slug:"suat-dien-dong-pin", icon:"🔋", tag:"Dòng điện không đổi",
   title:"Dòng điện không đổi – Đo suất điện động E và điện trở trong r của pin",
   short:"Thay đổi biến trở, ghi các cặp U – I và tìm E, r từ đồ thị U = E − r·I.",
   goal:"Thay đổi biến trở, đo cặp U – I và xác định E, r từ đồ thị U = E − r·I.",
   steps:["Chọn một pin (bấm “Đổi pin” để lấy pin khác).","Đặt giá trị biến trở R, đọc U (vôn kế) và I (ampe kế), bấm “Ghi số liệu”.","Lấy ít nhất 5 cặp (U, I) với R khác nhau.","Đồ thị U theo I là đường thẳng: cắt trục U tại E, độ dốc bằng −r."],
   eqs:[["Định luật Ôm cho toàn mạch","I = E / (R + r)"],["Hiệu điện thế mạch ngoài","U = E − I·r"],["Đọc từ đồ thị U(I)","giao trục U = E, hệ số góc = −r"]],
   tips:["Ampe kế có điện trở nhỏ (≈ 0,05 Ω) mắc nối tiếp, làm dòng điện giảm nhẹ.","Không để dòng lớn chạy lâu: pin nóng lên làm r thay đổi.","Chọn các giá trị R trải đều để các điểm phủ rộng trục I."],
   faq:[["Có thể đo E trực tiếp bằng vôn kế không?","Vôn kế có điện trở rất lớn nên đo được gần đúng E, nhưng không cho r. Phương pháp đồ thị cho cả E và r và giảm sai số ngẫu nhiên."],["Vì sao các điểm không thẳng hàng tuyệt đối?","Mỗi số chỉ đồng hồ có sai số ngẫu nhiên; đường thẳng khớp bằng bình phương tối thiểu cho giá trị tốt nhất."]],
   sims:[{label:"Đo E và r của pin",custom:"battery"}] },
 { grade:11, no:"11.4", slug:"tu-truong-trai-dat", icon:"🧭", tag:"Từ trường",
   title:"Đo thành phần nằm ngang của từ trường Trái Đất",
   short:"Dùng la bàn tang: đo độ lệch kim nam châm khi có dòng điện để suy ra B_h.",
   goal:"Dùng cuộn dây (la bàn tang) tạo từ trường vuông góc với B_h, đo độ lệch của kim nam châm để suy ra B_h.",
   steps:["Đặt mặt phẳng cuộn dây trùng với kinh tuyến từ (hướng Bắc – Nam).","Nhập N, R, I cho cuộn dây; kim dao động rồi dừng lệch một góc θ (xem đồ thị θ(t)).","Tính B_h = μ₀·N·I / (2R·tanθ).","Đảo chiều dòng điện, đo lại và lấy trung bình để giảm sai số.","Lặp lại với nhiều giá trị I."],
   eqs:[["Cảm ứng từ tại tâm cuộn dây","B_c = μ₀·N·I / (2R)"],["Điều kiện cân bằng của kim","tanθ = B_c / B_h"],["Thành phần nằm ngang","B_h = μ₀·N·I / (2R·tanθ)"]],
   tips:["Đặt xa vật bằng sắt, nam châm và dây dẫn khác – chúng làm lệch kim.","Chọn I sao cho θ ≈ 45°: sai số tương đối của tanθ nhỏ nhất ở góc này.","Đảo chiều dòng điện rồi lấy trung bình hai góc để triệt tiêu sai số do cuộn dây đặt lệch kinh tuyến."],
   faq:[["Vì sao nên chọn θ ≈ 45°?","Sai số tương đối của tanθ là 2Δθ/sin2θ, nhỏ nhất khi sin2θ = 1, tức θ = 45°."],["Vì sao phải đặt cuộn dây theo hướng Bắc – Nam?","Khi đó từ trường cuộn dây B_c vuông góc với B_h, nên tanθ = B_c/B_h đúng."]],
   sims:[{label:"La bàn tang",custom:"tangent"}] },
 { grade:12, no:"12.1", slug:"dao-dong-co", icon:"⏱️", tag:"Dao động",
   title:"Dao động cơ học",
   short:"Đo chu kì con lắc đơn và con lắc lò xo, kiểm chứng công thức chu kì bằng đồ thị T².",
   goal:"Đo chu kì con lắc đơn và con lắc lò xo, kiểm chứng T = 2π√(l/g) và T = 2π√(m/k).",
   steps:["Chọn con lắc, nhập chiều dài l (hoặc khối lượng m), biên độ ban đầu và số dao động n cần đếm.","Bấm “Thả & đo”, theo dõi đồ thị li độ theo thời gian và đọc thời gian t của n dao động.","Tính T = t/n và T².","Đồ thị T² theo l (hoặc theo m) là đường thẳng: hệ số góc 4π²/g (hoặc 4π²/k)."],
   eqs:[["Con lắc đơn (góc nhỏ)","T = 2π√(l / g)"],["Con lắc lò xo","T = 2π√(m / k)"],["Chu kì từ n dao động","T = t / n"],["Tuyến tính hoá","T² = (4π²/g)·l"]],
   tips:["Đo thời gian nhiều dao động: sai số bấm đồng hồ (≈ 0,04 s) chia cho n.","Giữ biên độ con lắc đơn nhỏ hơn 10° để công thức góc nhỏ còn đúng.","Chiều dài l tính từ điểm treo đến tâm quả nặng."],
   faq:[["Vì sao đo thời gian của 10 – 20 dao động?","Sai số bấm đồng hồ gần như không đổi, nên khi chia cho n, sai số của T giảm n lần."],["Vì sao đồ thị T² theo m của lò xo không đi qua gốc?","Lò xo có khối lượng; khối lượng hiệu dụng xấp xỉ m_lò xo/3 cộng vào m, làm đồ thị dịch lên."]],
   sims:[{label:"Con lắc đơn",custom:"pendulum"},{label:"Con lắc lò xo",custom:"spring"}] },
 { grade:12, no:"12.2", slug:"van-toc-am", icon:"🔊", tag:"Sóng âm",
   title:"Đo vận tốc truyền âm trong không khí",
   short:"Dịch pít-tông trong ống cộng hưởng, tìm hai vị trí âm to nhất và tính tốc độ âm.",
   goal:"Dùng ống cộng hưởng và nguồn âm có tần số f đã biết để xác định bước sóng λ, từ đó tính tốc độ truyền âm v.",
   steps:["Nhập tần số f của nguồn âm.","Kéo pít-tông thay đổi chiều dài cột khí; âm nghe to nhất ở vị trí cộng hưởng. Ghi hai vị trí cộng hưởng liên tiếp l₁ và l₂.","Bước sóng λ = 2(l₂ − l₁).","Tính v = λ·f.","Đo ở vài tần số khác nhau, lấy trung bình."],
   eqs:[["Cộng hưởng ống một đầu kín","l = (2n − 1)·λ/4"],["Bước sóng","λ = 2(l₂ − l₁)"],["Tốc độ truyền âm","v = λ·f"],["Phụ thuộc nhiệt độ","v ≈ 331 + 0,6·t (m/s, t tính bằng °C)"]],
   tips:["Bụng sóng ở miệng ống nằm hơi ra ngoài (hiệu chỉnh đầu ống ≈ 0,6R); dùng hiệu l₂ − l₁ để triệt tiêu sai số này.","Tiến chậm pít-tông qua vùng âm to để xác định đỉnh chính xác.","Ghi nhiệt độ phòng để so sánh với giá trị lí thuyết."],
   faq:[["Vì sao dùng hiệu l₂ − l₁ thay vì chỉ l₁?","Vị trí bụng sóng ở miệng ống lệch ra ngoài một đoạn chưa biết; hiệu hai vị trí cộng hưởng liên tiếp đúng bằng λ/2 và không phụ thuộc đoạn lệch này."],["Tốc độ âm phụ thuộc vào gì?","Chủ yếu vào nhiệt độ của không khí: mỗi độ C tăng thêm khoảng 0,6 m/s; không phụ thuộc tần số."]],
   sims:[{label:"Ống cộng hưởng",custom:"resonance"}] },
 { grade:12, no:"12.3", slug:"mach-xoay-chieu", icon:"〰️", tag:"Điện xoay chiều",
   title:"Mạch điện xoay chiều",
   short:"Khảo sát mạch R–L–C nối tiếp: điện áp thành phần, giản đồ véc-tơ và cộng hưởng.",
   goal:"Khảo sát mạch R, L, C mắc nối tiếp: đo các điện áp thành phần, độ lệch pha và hiện tượng cộng hưởng.",
   steps:["Nhập R, L, C, tần số f và điện áp hiệu dụng U của nguồn (mặc định 12 V).","Đọc U_R, U_L, U_C, U và cường độ dòng điện I; bấm “Ghi số liệu”.","Tính Z = U/I và kiểm tra U² = U_R² + (U_L − U_C)².","Thay đổi f để tìm cộng hưởng (I lớn nhất, U_L = U_C)."],
   eqs:[["Cảm kháng và dung kháng","Z_L = ωL,  Z_C = 1/(ωC)"],["Tổng trở","Z = √(R² + (Z_L − Z_C)²)"],["Độ lệch pha u so với i","tanφ = (Z_L − Z_C) / R"],["Tần số cộng hưởng","f₀ = 1 / (2π√(LC))"]],
   tips:["Đồng hồ xoay chiều đo giá trị hiệu dụng; điện áp thành phần cộng theo véc-tơ, không cộng đại số.","Cuộn cảm thật có điện trở thuần, làm U_L đo được lớn hơn I·Z_L.","Quét f theo bước nhỏ quanh f₀ để thấy rõ đỉnh cộng hưởng."],
   faq:[["Vì sao U_L hoặc U_C có thể lớn hơn điện áp nguồn?","U_L và U_C ngược pha nhau nên một phần triệt tiêu; khi gần cộng hưởng, mỗi điện áp riêng có thể lớn hơn nhiều so với U."],["Ở cộng hưởng mạch có đặc điểm gì?","Z_L = Z_C nên Z = R nhỏ nhất, I lớn nhất, u cùng pha với i (φ = 0)."]],
   sims:[{label:"Mạch R–L–C nối tiếp",custom:"rlc"}] },
 { grade:12, no:"12.4", slug:"buoc-song-anh-sang", icon:"🌈", tag:"Quang học sóng",
   title:"Đo bước sóng ánh sáng",
   short:"Chiếu laser qua khe Young, đo khoảng vân trên màn và tính bước sóng λ.",
   goal:"Dùng laser chiếu qua khe Young để tạo vân giao thoa, đo khoảng vân i rồi tính bước sóng λ.",

<script>
"use strict";
/* =====================================================================

const decOf = s => { s = String(s); const i = s.indexOf("."); return i < 0 ? 0 : s.length - i - 1; };
const attr = s => String(s).replace(/"/g, "&quot;");

const UI = {

  /* Ô nhập số + thanh trượt. min/max: giới hạn khi gõ phím; smin/smax: khoảng của thanh trượt */
  num(k, label, unit, o){
    const step = o.step || 1, smin = o.smin ?? o.min, smax = o.smax ?? o.max;
    return '<div class="field" data-f="' + k + '" data-kind="num" data-v="' + o.v + '" data-min="' + o.min + '" data-max="' + o.max + '" data-step="' + step + '">' +
      '<div class="frow"><label for="f-' + k + '">' + label + '</label><span class="nbox"><input id="f-' + k + '" class="nb" type="text" inputmode="' + (o.min < 0 ? "text" : "decimal") + '" autocomplete="off" spellcheck="false" title="Nhập giá trị từ ' + o.min + " đến " + o.max + (unit ? " " + unit : "") + '"><em>' + (unit || "") + "</em></span></div>" +
      '<input class="rg" type="range" min="' + smin + '" max="' + smax + '" step="' + step + '" aria-label="' + attr(label) + '">' +

  },
  sel: (k, label, opts, v) => '<div class="field" data-f="' + k + '" data-kind="sel"><label for="f-' + k + '">' + label + '</label><select id="f-' + k + '">' +
      opts.map(o => '<option value="' + attr(o[0]) + '"' + (String(o[0]) === String(v) ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select></div>",
  chk: (k, label, v) => '<label class="field chk" data-f="' + k + '" data-kind="chk"><input type="checkbox"' + (v ? " checked" : "") + "><span>" + label + "</span></label>",
  /* [lớp, nhãn, nút chính?, vô hiệu?] */

/* Gắn hành vi cho các trường; trả về kho thông số K */
function bind(root){

    const k = el.dataset.f, kind = el.dataset.kind; let f;

      const show = () => { rg.value = clamp(val, +rg.min, +rg.max); el.classList.toggle("out", val < +rg.min || val > +rg.max); };

    v: k => fields.get(k).get(),
    set: (k, x) => fields.get(k).set(x),
    on(keys, fn){ subs.push({ keys: keys === "*" ? null : [].concat(keys), fn }); },
    out(k, t){ const o = root.querySelector('[data-o="' + k + '"]'); if (o) o.textContent = t; },
    graph: (k, opt) => new LiveGraph(root.querySelector('[data-g="' + k + '"]'), opt)
  };
  root._K = K;
  return K;
}

/* Vòng lặp hoạt hình: dt (s) bị chặn 0,05 s, tạm nghỉ khi tab ẩn, tự dừng khi rời trang */
function loop(root, fn){
  let last = 0;
  const step = ts => {
    if (!root.isConnected) return;
    if (!document.hidden) fn(last ? Math.min((ts - last) / 1000, 0.05) : 0.016);
    last = ts; requestAnimationFrame(step);
  };

}

/* Đồ thị trực tiếp (LiveGraph): co giãn theo khung, nhiều chuỗi, tự chọn thang */
const GRAPHS = new Set();

    if (!host.isConnected) { GRAPHS.delete(self); return; }

    const g = cv.getContext("2d"), L = 46, R = 10, T = S.length > 1 || o.legend ? 20 : 10, B = 26, pw = W - L - R, ph = H - T - B;

    all.forEach(s => s.d.forEach(p => { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }));

    }
    const X = x => L + (x - x0) / (x1 - x0) * pw, Y = y => T + ph - (y - y0) / (y1 - y0) * ph;
    g.lineWidth = 1; g.font = F(10); g.fillStyle = C.muted;
    const sy = niceStep(y1 - y0) , sx = niceStep(x1 - x0);
    g.textAlign = "right";
    for (let v = Math.ceil(y0 / sy) * sy; v <= y1 + 1e-9; v += sy) { const yy = Y(v); g.strokeStyle = C.grid; g.beginPath(); g.moveTo(L, yy); g.lineTo(W - R, yy); g.stroke(); g.fillText(fmtTick(v, y1 - y0), L - 5, yy + 3); }

    for (let v = Math.ceil(x0 / sx) * sx; v <= x1 + 1e-9; v += sx) { const xx = X(v); g.strokeStyle = C.grid; g.beginPath(); g.moveTo(xx, T); g.lineTo(xx, T + ph); g.stroke(); g.fillText(fmtTick(v, x1 - x0), xx, H - B + 13); }
    if (y0 < 0 && y1 > 0) { g.strokeStyle = C.muted; g.globalAlpha = .5; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); g.globalAlpha = 1; }
    g.strokeStyle = C.muted; g.beginPath(); g.moveTo(L, T); g.lineTo(L, T + ph); g.lineTo(W - R, T + ph); g.stroke();

    g.save(); g.beginPath(); g.rect(L, T - 2, pw, ph + 4); g.clip();

    });

    if (T > 10) { let lx = L + 4; g.textAlign = "left"; g.font = F(10.5, 600); S.forEach(s => { g.fillStyle = C[s.color] || s.color; g.fillRect(lx, 7, 10, 3); lx += 14; g.fillStyle = C.ink2; g.fillText(s.label, lx, 12); lx += g.measureText(s.label).width + 14; }); }
    if (!all.length) { g.fillStyle = C.muted; g.textAlign = "center"; g.font = F(11.5); g.fillText(o.empty || "Chưa có dữ liệu – bắt đầu mô phỏng để vẽ đồ thị", L + pw / 2, T + ph / 2); }
    g.textAlign = "left";
  }
  this.draw = draw;
  this.request = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };
  this.push = (x, ys) => {
    S.forEach((s, i) => { const y = ys[i]; if (y == null || !Number.isFinite(y)) return; s.d.push([x, y]); });

  };

<script>
"use strict";
/* ================= 10.1 Mặt phẳng nghiêng ================= */
MOUNTS.incline = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="560" height="320"></canvas>',
    side:
      UI.panel("Thông số thí nghiệm",
        UI.sel("sf", "Cặp bề mặt", [["0", "Gỗ trên gỗ"], ["1", "Gỗ trên kim loại"], ["2", "Gỗ trên nhựa"], ["3", "Gỗ trên giấy nhám"]], "0") +
        UI.num("al", "Góc nghiêng α", "°", { v: 35, min: 1, max: 89, step: 1, smin: 10, smax: 60 }) +
        UI.num("s", "Quãng đường s", "m", { v: 0.5, min: 0.05, max: 1, step: 0.01, smin: 0.2, smax: 1 }) +
        UI.num("g", "Gia tốc trọng trường g", "m/s²", { v: 9.8, min: 0.5, max: 30, step: 0.01, smin: 1.6, smax: 25 })) +
      UI.panel("Điều khiển", UI.acts([["go", "▶ Thả vật", 1], ["ps", "⏸ Tạm dừng", 0, 1], ["rs", "↺ Đặt lại"], ["rec", "Ghi vào bảng", 0, 1]]) + '<div class="msg"></div>') +
      UI.panel("Số đo", UI.vals([["t", "Đồng hồ cổng quang", "s"], ["x", "Quãng đường đã đi", "m"], ["v", "Vận tốc tức thời", "m/s"]])),
    below: UI.graphs([["gs", "Quãng đường theo thời gian s(t)"], ["gv", "Vận tốc theo thời gian v(t)"]]) +
      UI.data(UI.acts([["rv", "Hiện μ thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const mus = [0.38, 0.3, 0.25, 0.55].map(b => b + gauss() * 0.01);
  const lg = Log(q(".lg"), ["α (°)", "s (m)", "t (s)", "a (m/s²)", "μ"]);
  const GS = K.graph("gs", { series: [{ label: "s (m)", color: "green" }], yLabel: "s (m)" });
  const GV = K.graph("gv", { series: [{ label: "v (m/s)", color: "orange" }], yLabel: "v (m/s)" });
  const P = { x: 530, y: 295 }, Ltot = 1.06;
  let dist = 0, running = false, paused = false, tt = 0, tTrue = 0, a = 0, tMeas = null, done = false;
  const mu = () => mus[+K.v("sf")], al = () => K.v("al"), s = () => K.v("s"), gg = () => K.v("g");
  function draw(){

    g.clearRect(0, 0, 560, 320);
    const top = { x: P.x - Ltot * ppm * Math.cos(A), y: P.y - Ltot * ppm * Math.sin(A) };
    g.fillStyle = C.surface; g.beginPath(); g.moveTo(top.x, top.y); g.lineTo(P.x, P.y); g.lineTo(top.x, P.y); g.closePath(); g.fill();
    g.strokeStyle = C.line; g.lineWidth = 3; g.beginPath(); g.moveTo(top.x, top.y); g.lineTo(P.x, P.y); g.stroke();
    g.beginPath(); g.moveTo(top.x - 10, P.y); g.lineTo(P.x + 10, P.y); g.stroke();
    const pt = u => ({ x: P.x - u * ppm * Math.cos(A), y: P.y - u * ppm * Math.sin(A) });
    const mk = (u, col, lab) => { const p = pt(u); g.save(); g.translate(p.x, p.y); g.rotate(A); g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -48); g.stroke(); g.restore(); g.fillStyle = col; g.font = F(11, 600); g.fillText(lab, p.x - 40 * Math.sin(A) - 6, p.y - 54 * Math.cos(A)); };
    mk(1.0, C.blue, "xuất phát"); mk(1.0 - s(), C.red, "cổng quang");
    const p = pt(1.0 - dist); g.save(); g.translate(p.x, p.y); g.rotate(A);
    g.fillStyle = C.wood; g.fillRect(-20, -26, 40, 26); g.strokeStyle = C.woodDark; g.lineWidth = 1.5; g.strokeRect(-20, -26, 40, 26);
    if (running || done) { const vv = Math.min(60, 12 * a * tt); if (vv > 4) arrow(g, 0, -13, vv, -13, C.orange, 2.5); }
    g.restore();
    g.fillStyle = C.ink; g.font = F(13, 600); g.fillText("α = " + al() + "°", P.x - 70, P.y - 8);
    g.fillStyle = C.muted; g.font = F(11); g.fillText("μ cần xác định · g = " + gg() + " m/s²", 12, 20);
  }
  root._redraw = draw;
  function out(){ K.out("t", done ? tMeas.toFixed(3) : running ? tt.toFixed(3) : "—"); K.out("x", dist.toFixed(3)); K.out("v", (running || done ? a * Math.min(tt, tTrue) : 0).toFixed(3)); }
  function reset(msg){ running = false; paused = false; dist = 0; tt = 0; tMeas = null; done = false; q(".rec").disabled = true; q(".go").disabled = false; q(".ps").disabled = true; q(".ps").textContent = "⏸ Tạm dừng"; q(".msg").textContent = msg || ""; GS.clear(); GV.clear(); out(); draw(); }

  };

  q(".rs").onclick = () => reset();
  K.on(["sf", "al", "s", "g"], () => reset());
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "μ " + stat(d.map(x => x.mu), 3, "") : ""; }

    if (!done) return; const A = al() * Math.PI / 180, aa = 2 * s() / (tMeas * tMeas), m = (gg() * Math.sin(A) - aa) / (gg() * Math.cos(A));
    lg.add([al(), s().toFixed(2), tMeas.toFixed(3), aa.toFixed(3), m.toFixed(3)], { mu: m }); q(".rec").disabled = true; done = false; showMean();

};

MOUNTS.freefall = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="420" height="360"></canvas>',
    side:
      UI.panel("Thông số thí nghiệm",

        UI.num("sl", "Tốc độ phát lại (quay chậm)", "×", { v: 0.4, min: 0.05, max: 1, step: 0.05, smin: 0.1, smax: 1 })) +
      UI.panel("Điều khiển", UI.acts([["go", "▶ Thả vật", 1], ["ps", "⏸ Tạm dừng", 0, 1], ["rs", "↺ Đặt lại"], ["rec", "Ghi vào bảng", 0, 1]]) + '<div class="msg"></div>') +
      UI.panel("Số đo", UI.vals([["t", "Đồng hồ hiện số", "s"], ["y", "Quãng đường đã rơi", "m"], ["v", "Vận tốc tức thời", "m/s"]])),
    below: UI.graphs([["gy", "Quãng đường rơi theo thời gian y(t)"], ["gv", "Vận tốc theo thời gian v(t)"]]) +
      UI.data('<canvas class="ch" width="520" height="260"></canvas><div class="res fit"></div>' + UI.acts([["rv", "Hiện g thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const gTrue = 9.78 + gauss() * 0.02, yGate = 330;
  const lg = Log(q(".lg"), ["s (m)", "t (s)", "t² (s²)", "g = 2s/t² (m/s²)"]);
  const GY = K.graph("gy", { series: [{ label: "y (m)", color: "purple" }], yLabel: "y (m)" });
  const GV = K.graph("gv", { series: [{ label: "v (m/s)", color: "orange" }], yLabel: "v (m/s)" });
  let y = 0, running = false, paused = false, tt = 0, tTrue = 0, tMeas = null, done = false;
  const s = () => K.v("s");
  function draw(){
    const Hm = Math.max(1.5, s() * 1.08), ppm = 300 / Hm, minor = Hm <= 1.6 ? 0.1 : Hm <= 3.2 ? 0.25 : 0.5;
    g.clearRect(0, 0, 420, 360);
    g.fillStyle = C.surface; g.fillRect(40, 10, 6, 340);
    g.font = F(11);
    for (let i = 0; i * minor <= Hm + 1e-9; i++) { const m = i * minor, yy = yGate - m * ppm, major = i % (minor === 0.1 ? 5 : 2) === 0; g.fillStyle = C.ink2; g.fillRect(40, yy, major ? 22 : 12, 1.5); if (major) g.fillText(m.toFixed(1) + " m", 2, yy + 4); }
    const top = yGate - s() * ppm;
    g.fillStyle = C.metal; g.fillRect(200, top - 22, 60, 8); g.fillStyle = C.muted; g.fillText("nam châm điện", 270, top - 14);
    g.fillStyle = C.red; g.fillRect(190, yGate, 80, 6); g.fillStyle = C.ink2; g.fillText("cổng quang", 275, yGate + 6);
    g.setLineDash([3, 4]); g.strokeStyle = C.muted; g.lineWidth = 1; g.beginPath(); g.moveTo(230, top); g.lineTo(230, yGate); g.stroke(); g.setLineDash([]);
    const by = top + y * ppm; g.fillStyle = C.blue; g.beginPath(); g.arc(230, by - 10, 10, 0, 2 * Math.PI); g.fill();
    if (running || done) { const vv = Math.min(70, 9 * gTrue * Math.min(tt, tTrue)); if (vv > 4) arrow(g, 252, by - 10, 252, by - 10 + vv, C.orange, 2.5); }
    g.fillStyle = C.ink; g.font = F(12, 600); g.fillText("phát lại ×" + K.v("sl"), 320, 22);
  }
  function out(){ K.out("t", done ? tMeas.toFixed(3) : running ? "…" : "—"); K.out("y", y.toFixed(3)); K.out("v", (gTrue * Math.min(tt, tTrue || 0)).toFixed(3)); }
  function reset(){ running = false; paused = false; y = 0; tt = 0; tMeas = null; done = false; q(".rec").disabled = true; q(".go").disabled = false; q(".ps").disabled = true; q(".ps").textContent = "⏸ Tạm dừng"; GY.clear(); GV.clear(); out(); draw(); }
  loop(root, dt => {
    if (!running || paused) return;
    tt += dt * K.v("sl");
    if (tt >= tTrue) { tt = tTrue; running = false; done = true; y = s(); tMeas = Math.max(0.001, rnd(tTrue + gauss() * 0.0008, 0.001)); q(".rec").disabled = false; q(".go").disabled = false; q(".ps").disabled = true; }
    else y = 0.5 * gTrue * tt * tt;
    GY.push(tt, [y]); GV.push(tt, [gTrue * tt]); out(); draw();
  });
  q(".go").onclick = () => { reset(); tTrue = Math.sqrt(2 * s() / gTrue); running = true; q(".go").disabled = true; q(".ps").disabled = false; GY.push(0, [0]); GV.push(0, [0]); };
  q(".ps").onclick = () => { if (!running) return; paused = !paused; q(".ps").textContent = paused ? "▶ Tiếp tục" : "⏸ Tạm dừng"; };
  q(".rs").onclick = reset;
  K.on("s", reset); K.on("sl", draw);
  function refresh(){
    const d = lg.data(), pts = d.map(x => ({ x: x.t2, y: x.s })), f = lineFit(pts);
    plotXY(q(".ch"), pts, "t² (s²)", "s (m)", f, 0.3, 1);
    q(".fit").innerHTML = f ? "Từ đồ thị s – t²: hệ số góc = " + f.b.toFixed(3) + " m/s² → g = 2·hệ số góc = <b>" + (2 * f.b).toFixed(2) + "</b> m/s²" + (d.length ? " &nbsp;|&nbsp; Trung bình các lần: " + stat(d.map(x => x.g), 2, "m/s²") : "") : "Cần ít nhất 2 lần đo ở các độ cao khác nhau để vẽ đường khớp s – t².";
  }
  root._redraw = () => { draw(); refresh(); };
  q(".rec").onclick = () => { if (!done) return; const t2 = tMeas * tMeas, g2 = 2 * s() / t2; lg.add([s().toFixed(2), tMeas.toFixed(3), t2.toFixed(4), g2.toFixed(2)], { s: s(), t2, g: g2 }); q(".rec").disabled = true; done = false; refresh(); };
  q(".clr").onclick = () => { lg.clear(); refresh(); };
  q(".rv").onclick = () => { q(".tr").innerHTML = '<span class="ok">g thật tại nơi làm thí nghiệm (mô hình) = ' + gTrue.toFixed(3) + " m/s²</span>"; };
  reset(); refresh();
};

MOUNTS.vec2 = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="520" height="380"></canvas>',
    side:
      UI.panel("Các lực",
        UI.num("f1", "Lực F₁", "N", { v: 3, min: 0.1, max: 50, step: 0.1, smin: 1, smax: 5 }) +
        UI.num("f2", "Lực F₂", "N", { v: 4, min: 0.1, max: 50, step: 0.1, smin: 1, smax: 5 }) +
        UI.num("th", "Góc θ giữa hai lực", "°", { v: 90, min: 0, max: 180, step: 1, smin: 0, smax: 180 }) +
        UI.chk("pg", "Hiện hình bình hành lực", true)) +
      UI.panel("Số đo", UI.vals([["dg", "Đường chéo (tỉ xích 1 N = 1 cm)", "cm"], ["fm", "Lực kế thứ ba (cân bằng)", "N"]]) + UI.acts([["rec", "Ghi vào bảng", 1]])),
    below: UI.data(UI.acts([["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const lg = Log(q(".lg"), ["F₁ (N)", "F₂ (N)", "θ (°)", "F tính (N)", "F đo (N)", "Sai lệch (%)"]);
  const O = { x: 260, y: 240 };
  let Fm = 0, diag = 0, Rcalc = 0;
  function update(){
    const th = K.v("th") * Math.PI / 180, f1 = K.v("f1"), f2 = K.v("f2");
    Rcalc = Math.sqrt(f1 * f1 + f2 * f2 + 2 * f1 * f2 * Math.cos(th));
    diag = Math.max(0, rnd(Rcalc + gauss() * 0.03, 0.1)); Fm = Math.max(0, rnd(Rcalc * (1 + gauss() * 0.012), 0.01));
    K.out("dg", diag.toFixed(1)); K.out("fm", Fm.toFixed(2)); draw();
  }
  function draw(){
    g.clearRect(0, 0, 520, 380);
    const f1 = K.v("f1"), f2 = K.v("f2"), th = K.v("th") * Math.PI / 180, k = Math.min(40, 170 / Math.max(f1, f2, Rcalc, 0.1));
    const p1 = Math.PI / 2 + th / 2, p2 = Math.PI / 2 - th / 2;
    const e1 = { x: O.x + f1 * k * Math.cos(p1), y: O.y - f1 * k * Math.sin(p1) }, e2 = { x: O.x + f2 * k * Math.cos(p2), y: O.y - f2 * k * Math.sin(p2) };
    const er = { x: e1.x + e2.x - O.x, y: e1.y + e2.y - O.y }, e3 = { x: 2 * O.x - er.x, y: 2 * O.y - er.y };
    if (K.v("pg")) { g.setLineDash([5, 4]); g.strokeStyle = C.muted; g.lineWidth = 1.5; g.beginPath(); g.moveTo(e1.x, e1.y); g.lineTo(er.x, er.y); g.lineTo(e2.x, e2.y); g.stroke(); g.setLineDash([]); }
    arrow(g, O.x, O.y, e1.x, e1.y, C.red); arrow(g, O.x, O.y, e2.x, e2.y, C.blue);
    if (Rcalc > 1e-6) { arrow(g, O.x, O.y, er.x, er.y, C.green, 3); arrow(g, O.x, O.y, e3.x, e3.y, C.purple, 2.5); }
    g.font = F(13, 600);
    g.fillStyle = C.red; g.fillText("F₁", e1.x - 18, e1.y - 6); g.fillStyle = C.blue; g.fillText("F₂", e2.x + 6, e2.y - 6);
    g.fillStyle = C.green; g.fillText("F (hợp lực)", er.x + 8, er.y); g.fillStyle = C.purple; g.fillText("F đo (lực kế 3)", e3.x - 40, e3.y + 18);
    g.fillStyle = C.ink; g.beginPath(); g.arc(O.x, O.y, 5, 0, 2 * Math.PI); g.fill();
    g.fillStyle = C.muted; g.font = F(11); g.fillText("Tỉ xích hình vẽ: 1 N ứng với " + k.toFixed(0) + " px", 12, 370);
  }
  root._redraw = draw;
  K.on(["f1", "f2", "th"], update); K.on("pg", draw);
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "Sai lệch trung bình: " + stat(d.map(x => x.e), 1, "%") : ""; }
  q(".rec").onclick = () => { if (Rcalc < 1e-6) return; const e = Math.abs(Fm - Rcalc) / Rcalc * 100; lg.add([K.v("f1").toFixed(1), K.v("f2").toFixed(1), K.v("th"), Rcalc.toFixed(2), Fm.toFixed(2), e.toFixed(1)], { e }); showMean(); update(); };
  q(".clr").onclick = () => { lg.clear(); showMean(); };
  update();
};

MOUNTS.parallel = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="560" height="320"></canvas>',
    side:
      UI.panel("Quả cân",
        UI.num("w1", "Lực F₁", "N", { v: 1, min: 0.1, max: 20, step: 0.1, smin: 0.5, smax: 5 }) +
        UI.num("x1", "Vị trí treo F₁", "cm", { v: 20, min: 0, max: 50, step: 0.5, smin: 0, smax: 50 }) +
        UI.num("w2", "Lực F₂", "N", { v: 2, min: 0.1, max: 20, step: 0.1, smin: 0.5, smax: 5 }) +
        UI.num("x2", "Vị trí treo F₂", "cm", { v: 75, min: 50, max: 100, step: 0.5, smin: 50, smax: 100 })) +
      UI.panel("Điểm đỡ (lực kế)", UI.num("p", "Vị trí điểm đỡ p", "cm", { v: 50, min: 0, max: 100, step: 0.1, smin: 0, smax: 100 }) + UI.acts([["rec", "Ghi vào bảng", 1]]) + '<div class="msg"></div>') +
      UI.panel("Số đo", UI.vals([["st", "Trạng thái thanh", ""], ["fr", "Số chỉ lực kế F", "N"], ["tq", "Mômen tổng quanh điểm đỡ", "N·cm"]])),
    below: UI.data(UI.acts([["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const lg = Log(q(".lg"), ["F₁ (N)", "F₂ (N)", "d₁ (cm)", "d₂ (cm)", "F (N)", "F₁d₁", "F₂d₂"]);
  const ppc = 4.8, X0 = 40;
  let Fm = 0, ang = 0;
  function state(){ const W1 = K.v("w1"), W2 = K.v("w2"), p = K.v("p"), tau = W1 * (K.v("x1") - p) + W2 * (K.v("x2") - p); return { W1, W2, p, tau, bal: Math.abs(tau) <= 0.3 * (W1 + W2) }; }
  function update(){
    const s = state(); Fm = rnd(s.W1 + s.W2 + gauss() * 0.01, 0.01);
    K.out("st", s.bal ? "nằm ngang (cân bằng)" : (s.tau > 0 ? "nghiêng phải" : "nghiêng trái")); K.out("fr", Fm.toFixed(2)); K.out("tq", s.tau.toFixed(1));
  }
  function draw(){
    const s = state(); g.clearRect(0, 0, 560, 320);
    const px = X0 + s.p * ppc, py = 120;
    const pos = x => ({ x: px + (x - s.p) * ppc * Math.cos(ang), y: py + (x - s.p) * ppc * Math.sin(ang) });
    g.fillStyle = C.gaugeBg; g.strokeStyle = C.line; g.lineWidth = 2; g.fillRect(px - 32, 18, 64, 48); g.strokeRect(px - 32, 18, 64, 48);
    g.fillStyle = C.gaugeInk; g.font = FM(13, 600); g.textAlign = "center"; g.fillText(Fm.toFixed(2) + " N", px, 47); g.textAlign = "left";
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(px, 66); g.lineTo(px, py); g.stroke();
    const a = pos(0), b = pos(100);
    g.strokeStyle = s.bal ? C.green : C.orange; g.lineWidth = 8; g.lineCap = "round"; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    g.lineCap = "butt"; g.font = F(10);
    for (let m = 0; m <= 100; m += 10) { const t = pos(m); g.fillStyle = C.ink2; g.fillRect(t.x - 1, t.y + 6, 2, 6); if (m % 20 === 0) g.fillText(m, t.x - 6, t.y + 24); }
    [[s.W1, K.v("x1"), C.red, "F₁"], [s.W2, K.v("x2"), C.blue, "F₂"]].forEach(w => {
      const t = pos(w[1]), ww = Math.min(w[0], 8), h = 40 + ww * 6; g.strokeStyle = w[2]; g.lineWidth = 2; g.beginPath(); g.moveTo(t.x, t.y); g.lineTo(t.x, t.y + h); g.stroke();
      g.fillStyle = w[2]; const sz = 14 + ww * 5; g.fillRect(t.x - sz / 2, t.y + h, sz, sz); g.fillStyle = C.ink; g.font = F(12, 600); g.fillText(w[3] + " = " + w[0].toFixed(1) + " N", t.x - 28, t.y + h + sz + 15);
    });
  }
  root._redraw = draw;
  /* Thanh quay dần tới góc nghiêng mới (hoạt hình tắt dần) */
  let w = 0;
  loop(root, dt => {
    const s = state(), target = s.bal ? 0 : clamp(s.tau * 0.12, -15, 15) * Math.PI / 180;
    const acc = -40 * (ang - target) - 9 * w; w += acc * dt; ang += w * dt;
    if (Math.abs(ang - target) > 1e-4 || Math.abs(w) > 1e-4) draw();
  });
  K.on("*", () => { update(); draw(); });
  q(".rec").onclick = () => {
    const s = state(); if (!s.bal) { q(".msg").textContent = "Thanh chưa cân bằng: hãy dịch điểm đỡ cho thanh nằm ngang rồi ghi."; return; }
    q(".msg").textContent = "";
    const d1 = Math.round((s.p - K.v("x1")) * 10) / 10, d2 = Math.round((K.v("x2") - s.p) * 10) / 10;
    lg.add([s.W1.toFixed(1), s.W2.toFixed(1), d1.toFixed(1), d2.toFixed(1), Fm.toFixed(2), (s.W1 * d1).toFixed(1), (s.W2 * d2).toFixed(1)], { a: s.W1 * d1, b: s.W2 * d2, f: Fm, sum: s.W1 + s.W2 });
    const d = lg.data(); q(".mean").innerHTML = "Sai lệch F₁d₁ so với F₂d₂ (trung bình): " + stat(d.map(x => Math.abs(x.a - x.b) / Math.abs(x.a || 1) * 100), 1, "%") + "<br>Sai lệch F so với F₁ + F₂: " + stat(d.map(x => Math.abs(x.f - x.sum) / x.sum * 100), 1, "%");
  };
  q(".clr").onclick = () => { lg.clear(); q(".mean").innerHTML = ""; };
  update(); draw();
};

  const Ftrue = x => x >= hb ? 0 : x < hp ? Fmax * Math.sin(x / hp * Math.PI / 2) : Fmax * (1 - 0.08 * (x - hp) / (hb - hp));
  const params = () => { const D1 = K.v("D1"), D2 = K.v("D2"); return { D1, D2, ok: D1 > D2 && D2 > 0 }; };
  function draw(reading){

    g.strokeStyle = C.line; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - rx * 0.8, ry - 6); g.lineTo(cx, 62); g.moveTo(cx + rx * 0.8, ry - 6); g.lineTo(cx, 62); g.stroke();
    g.strokeStyle = C.metal; g.lineWidth = 5; g.beginPath(); g.ellipse(cx, ry, rx, 9, 0, 0, 2 * Math.PI); g.stroke();
    g.fillStyle = C.gaugeBg; g.strokeStyle = C.line; g.lineWidth = 2; g.fillRect(cx - 62, 8, 124, 54); g.strokeRect(cx - 62, 8, 124, 54);
    g.fillStyle = C.gaugeInk; g.font = FM(16, 600); g.textAlign = "center"; g.fillText(reading.toFixed(4) + " N", cx, 44);
    g.font = F(11); g.fillStyle = C.muted; g.fillText("lực kế", cx, 23);
    g.fillStyle = C.ink; g.textAlign = "left"; g.font = F(12, 600); g.fillText("h = " + h.toFixed(1) + " mm", 420, 260);
  }
  root._redraw = () => draw(lastR);
  const reading = () => Math.max(0, Math.round((Ftrue(h) * factor + gauss() * 0.0002) / 0.0005) * 0.0005);
  function out(r){ K.out("F", r.toFixed(4)); K.out("pk", peak ? peak.toFixed(4) : "—"); K.out("h", h.toFixed(2)); }
  loop(root, dt => {
    if (!running || paused) return;
    tt += dt; h += K.v("vk") * dt;
    const r = reading(); if (r > peak) peak = r;
    GF.push(tt, [r * 1000]); out(r); draw(r);
    if (h >= 7) { running = false; done = true; q(".go").disabled = false; q(".ps").disabled = true; q(".rec").disabled = false; q(".msg").textContent = "Màng chất lỏng đã đứt. Ghi F_max vào bảng."; draw(0); }
  });
  function reset(){ running = false; paused = false; h = 0; tt = 0; peak = 0; done = false; q(".go").disabled = false; q(".ps").disabled = true; q(".ps").textContent = "⏸ Tạm dừng"; q(".rec").disabled = true; q(".msg").textContent = ""; GF.clear(); out(0); draw(0); }
  q(".go").onclick = () => {
    const p = params(); if (!p.ok) { q(".msg").textContent = "Cần D₁ > D₂ > 0."; return; }
    reset(); Fmax = sigmaRef() / 1000 * Math.PI * (p.D1 + p.D2) / 1000; factor = 1 + gauss() * 0.012;
    running = true; q(".go").disabled = true; q(".ps").disabled = false; GF.push(0, [0]);
  };
  q(".ps").onclick = () => { if (!running) return; paused = !paused; q(".ps").textContent = paused ? "▶ Tiếp tục" : "⏸ Tạm dừng"; };
  q(".rs").onclick = reset;
  K.on(["liq", "T", "D1", "D2"], reset);
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "σ " + stat(d.map(r => r.s), 1, "mN/m") : ""; }
  q(".rec").onclick = () => {
    if (!done || peak <= 0) return; const p = params(), sg = peak / (Math.PI * (p.D1 + p.D2) / 1000) * 1000;
    if (!lg.add([p.D1, p.D2, peak.toFixed(4), sg.toFixed(1)], { s: sg })) { q(".msg").textContent = "Bảng đã đủ 10 lần."; return; }
    q(".rec").disabled = true; done = false; showMean();
  };
  q(".clr").onclick = () => { lg.clear(); showMean(); q(".tr").textContent = ""; };
  q(".rv").onclick = () => {
    const d = lg.data(); if (!d.length) { q(".tr").textContent = "Hãy ghi ít nhất một lần đo trước."; return; }
    const m = mean(d.map(r => r.s)), ref = sigmaRef();
    q(".tr").innerHTML = '<span class="ok">Giá trị mô hình ở ' + K.v("T") + " °C: " + ref.toFixed(1) + " mN/m. Sai số tương đối: " + (Math.abs(m - ref) / ref * 100).toFixed(1) + " %</span>";
  };
  reset();
};

<script>
"use strict";
/* ================= 11.1A Lực từ lên đoạn dây ================= */
MOUNTS.magforce = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="560" height="340"></canvas><p class="hint">Quy tắc bàn tay trái: đường sức từ xuyên vào lòng bàn tay, chiều từ cổ tay đến ngón tay là chiều dòng điện, ngón cái choãi ra 90° chỉ chiều lực từ.</p>',
    side:
      UI.panel("Thông số",
        UI.num("B", "Cảm ứng từ B", "T", { v: 0.2, min: 0, max: 5, step: 0.01, smin: 0, smax: 0.5 }) +
        UI.num("I", "Cường độ dòng điện I", "A", { v: 2, min: 0, max: 50, step: 0.1, smin: 0, smax: 5 }) +
        UI.num("l", "Chiều dài đoạn dây l", "m", { v: 0.1, min: 0.01, max: 1, step: 0.01, smin: 0.02, smax: 0.2 }) +
        UI.num("a", "Góc α giữa dây và đường sức", "°", { v: 90, min: 0, max: 180, step: 1, smin: 0, smax: 180 })) +
      UI.panel("Điều khiển", UI.acts([["rec", "Ghi vào bảng", 1], ["flip", "⇄ Đảo chiều dòng điện"]])) +
      UI.panel("Số đo", UI.vals([["F", "Lực từ đo được", "N"], ["dir", "Chiều lực", ""]])),
    below: UI.data(UI.acts([["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const lg = Log(q(".lg"), ["B (T)", "I (A)", "l (m)", "α (°)", "F (N)", "B = F/(I·l·sinα) (T)"]);
  let sgn = 1, Fm = 0;
  const physics = () => K.v("B") * K.v("I") * K.v("l") * Math.sin(K.v("a") * Math.PI / 180);
  function update(){
    const Fv = physics(); Fm = Math.max(0, Math.round(Fv * (1 + gauss() * 0.01) / 0.0001) * 0.0001);
    K.out("F", Fm.toFixed(4)); K.out("dir", Fv < 1e-9 ? "không có lực" : (sgn > 0 ? "⊗ vào trong trang" : "⊙ ra ngoài trang")); draw(Fv);
  }
  function draw(Fv){
    g.clearRect(0, 0, 560, 340); const B = K.v("B");
    g.strokeStyle = C.blue; g.fillStyle = C.blue; g.lineWidth = 2; g.globalAlpha = 0.15 + Math.min(B, 0.5) / 0.5 * 0.7;
    if (B > 0) for (let y = 40; y < 320; y += 55) for (let x = 30; x < 540; x += 70) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + 44, y); g.stroke(); g.beginPath(); g.moveTo(x + 44, y); g.lineTo(x + 36, y - 4); g.lineTo(x + 36, y + 4); g.closePath(); g.fill(); }
    g.globalAlpha = 1;
    g.fillStyle = C.blue; g.font = F(12, 600); g.fillText("B →", 8, 16);
    const l = K.v("l"), cx = 280, cy = 175, len = l * Math.min(1000, 300 / l), a = K.v("a") * Math.PI / 180, dx = Math.cos(a) * len / 2, dy = -Math.sin(a) * len / 2;
    g.strokeStyle = C.orange; g.lineWidth = 7; g.lineCap = "round"; g.beginPath(); g.moveTo(cx - dx, cy - dy); g.lineTo(cx + dx, cy + dy); g.stroke(); g.lineCap = "butt";
    if (K.v("I") > 0) { const hx = sgn > 0 ? cx + dx : cx - dx, hy = sgn > 0 ? cy + dy : cy - dy, ux = sgn * Math.cos(a), uy = -sgn * Math.sin(a); g.fillStyle = C.red; g.beginPath(); g.moveTo(hx + ux * 14, hy + uy * 14); g.lineTo(hx - uy * 8, hy + ux * 8); g.lineTo(hx + uy * 8, hy - ux * 8); g.closePath(); g.fill(); }
    g.fillStyle = C.ink; g.font = F(13, 600); g.fillText("I", cx + dx + 20, cy + dy - 8);
    if (Fv > 1e-9) {
      const r = 14 + Math.min(26, Fv * 45);
      g.fillStyle = C.bg; g.strokeStyle = C.red; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy + 62, r, 0, 2 * Math.PI); g.fill(); g.stroke(); g.fillStyle = C.red;
      if (sgn > 0) { g.beginPath(); g.moveTo(cx - r * 0.55, cy + 62 - r * 0.55); g.lineTo(cx + r * 0.55, cy + 62 + r * 0.55); g.moveTo(cx + r * 0.55, cy + 62 - r * 0.55); g.lineTo(cx - r * 0.55, cy + 62 + r * 0.55); g.stroke(); }
      else { g.beginPath(); g.arc(cx, cy + 62, r * 0.28, 0, 2 * Math.PI); g.fill(); }
      g.font = F(12, 600); g.fillText("F từ", cx + r + 8, cy + 66);
    }
  }
  root._redraw = () => draw(physics());
  K.on("*", update);
  q(".flip").onclick = () => { sgn = -sgn; update(); };
  q(".rec").onclick = () => { const I = K.v("I"), l = K.v("l"), a = K.v("a"), s = Math.sin(a * Math.PI / 180), est = (I > 0 && s > 0.01 && Fm > 0) ? Fm / (I * l * s) : null; lg.add([K.v("B").toFixed(2), I.toFixed(1), l.toFixed(2), a, Fm.toFixed(4), est === null ? "—" : est.toFixed(3)], {}); };
  q(".clr").onclick = () => lg.clear();
  update();
};

/* ================= 11.1B Cảm ứng điện từ ================= */
MOUNTS.induction = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="600" height="320"></canvas><p class="hint">Kéo nam châm bằng chuột (hoặc ngón tay) ra vào cuộn dây, hoặc bấm “Tự động”.</p>',
    side:
      UI.panel("Thông số",
        UI.num("N", "Số vòng dây N", "vòng", { v: 200, min: 1, max: 2000, step: 1, smin: 50, smax: 500 }) +
        UI.num("S", "Độ mạnh nam châm", "×", { v: 2, min: 0.1, max: 10, step: 0.1, smin: 1, smax: 3 }) +
        UI.num("per", "Chu kì chuyển động tự động", "s", { v: 3, min: 0.2, max: 20, step: 0.1, smin: 0.5, smax: 8 })) +
      UI.panel("Điều khiển", UI.acts([["go auto", "▶ Tự động", 1], ["pol", "⇄ Đổi cực"], ["rs", "↺ Xoá đỉnh & đồ thị"]])) +
      UI.panel("Số đo", UI.vals([["e", "Suất điện động e", "mV"], ["pk", "Đỉnh |e|max", "mV"], ["nd", "Kim điện kế", ""]])),
    below: UI.graphs([["gp", "Từ thông qua cuộn dây Φ(t)"], ["ge", "Suất điện động cảm ứng e(t)"]])
  }));
  const K = bind(root), q = s => root.querySelector(s), cv = q(".scene"), g = cv.getContext("2d");
  const GP = K.graph("gp", { series: [{ label: "Φ (đơn vị tương đối)", color: "purple" }], yLabel: "Φ", window: 8, sym: true });
  const GE = K.graph("ge", { series: [{ label: "e (mV)", color: "red" }], yLabel: "e (mV)", window: 8, sym: true });
  const cx = 380, cy = 170, ppc = 10;
  let mx = 150, pol = 1, auto = false, tAuto = 0, dragging = false, drgOff = 0, phiPrev = null, emf = 0, peak = 0, needle = 0, T = 0;
  const phi = X => pol * K.v("S") / Math.pow(1 + Math.pow(X / 5, 2), 1.5);
  function drawScene(){
    g.clearRect(0, 0, 600, 320);
    const turns = clamp(Math.round(K.v("N") / 100 * 3), 1, 16);
    g.strokeStyle = C.orange; g.lineWidth = 3;
    for (let i = 0; i < turns; i++) { const x = cx - 20 + i * (40 / Math.max(1, turns - 1)); g.beginPath(); g.ellipse(x, cy, 9, 48, 0, 0, 2 * Math.PI); g.stroke(); }
    g.beginPath(); g.moveTo(cx - 20, cy + 48); g.lineTo(cx - 20, 285); g.lineTo(500, 285); g.lineTo(500, 250); g.moveTo(cx + 20, cy + 48); g.lineTo(cx + 20, 300); g.lineTo(560, 300); g.lineTo(560, 250); g.stroke();
    g.fillStyle = C.muted; g.font = F(11); g.fillText("N = " + K.v("N") + " vòng", cx - 34, cy - 62);
    const gx = 500, gy = 215; g.fillStyle = C.gaugeBg; g.strokeStyle = C.line; g.lineWidth = 2; g.beginPath(); g.arc(gx, gy, 42, Math.PI, 2 * Math.PI); g.lineTo(gx + 42, gy + 10); g.lineTo(gx - 42, gy + 10); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = C.red; g.lineWidth = 2.5; g.beginPath(); g.moveTo(gx, gy + 6); g.lineTo(gx + 36 * Math.sin(needle), gy + 6 - 36 * Math.cos(needle)); g.stroke();
    g.fillStyle = C.ink; g.textAlign = "center"; g.fillText("điện kế", gx, gy + 26); g.textAlign = "left";
    const b = clamp(Math.abs(emf) / 250, 0, 1), bx = 560, by = 215;
    g.save(); g.shadowColor = "rgba(255,210,60,.9)"; g.shadowBlur = 30 * b;
    g.fillStyle = "rgba(255,220,60," + (0.12 + 0.88 * b) + ")"; g.strokeStyle = C.metal; g.lineWidth = 2; g.beginPath(); g.arc(bx, by - 8, 18, 0, 2 * Math.PI); g.fill(); g.stroke(); g.restore();
    g.fillStyle = C.metal; g.fillRect(bx - 8, by + 8, 16, 10);
    g.fillStyle = C.ink; g.textAlign = "center"; g.fillText("bóng đèn", bx, by + 34); g.textAlign = "left";
    const L = 90, H = 36;
    g.fillStyle = pol > 0 ? C.red : C.blue; g.fillRect(mx - L / 2, cy - H / 2, L / 2, H); g.fillStyle = pol > 0 ? C.blue : C.red; g.fillRect(mx, cy - H / 2, L / 2, H);
    g.fillStyle = "#fff"; g.font = F(15, 700); g.textAlign = "center"; g.fillText(pol > 0 ? "N" : "S", mx - L / 4, cy + 5); g.fillText(pol > 0 ? "S" : "N", mx + L / 4, cy + 5); g.textAlign = "left";
  }
  loop(root, dt => {
    T += dt;
    if (auto) { tAuto += dt; mx = cx + 170 * Math.sin(2 * Math.PI * tAuto / K.v("per")) - 40; }
    const ph = phi((mx - cx) / ppc);
    if (phiPrev !== null && dt > 0) { const e = -K.v("N") * (ph - phiPrev) / dt * 0.5; emf = 0.75 * emf + 0.25 * e; }
    phiPrev = ph;
    if (!auto && !dragging) emf *= 0.85;
    needle += (clamp(emf / 500, -1, 1) * 0.9 - needle) * 0.3;
    if (Math.abs(emf) > peak) peak = Math.abs(emf);
    K.out("e", emf.toFixed(0)); K.out("pk", peak.toFixed(0));
    K.out("nd", Math.abs(emf) < 5 ? "đứng yên" : (emf > 0 ? "lệch phải" : "lệch trái"));
    GP.push(T, [ph]); GE.push(T, [emf]);
    drawScene();
  });
  const pos = ev => { const r = cv.getBoundingClientRect(); return (ev.clientX - r.left) * 600 / r.width; };
  const setAuto = v => { auto = v; tAuto = Math.asin(clamp((mx + 40 - cx) / 170, -1, 1)) * K.v("per") / (2 * Math.PI); q(".auto").textContent = auto ? "■ Dừng" : "▶ Tự động"; };
  cv.addEventListener("pointerdown", ev => { const p = pos(ev); if (Math.abs(p - mx) < 55) { dragging = true; setAuto(false); drgOff = mx - p; cv.setPointerCapture(ev.pointerId); cv.style.cursor = "grabbing"; } });
  cv.addEventListener("pointermove", ev => { if (dragging) mx = clamp(pos(ev) + drgOff, 60, 560); else cv.style.cursor = Math.abs(pos(ev) - mx) < 55 ? "grab" : "default"; });
  const up = () => { dragging = false; cv.style.cursor = "default"; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  q(".auto").onclick = () => setAuto(!auto);
  q(".pol").onclick = () => { pol = -pol; phiPrev = null; };
  q(".rs").onclick = () => { peak = 0; GP.clear(); GE.clear(); };
};

/* ================= 11.2 Thấu kính ================= */
MOUNTS.lens = function(root){
  setHTML(root, UI.layout({
    stage: '<canvas class="scene" width="640" height="300"></canvas>',
    side:
      UI.panel("Vị trí",
        UI.num("d", "Khoảng cách vật – thấu kính d", "cm", { v: 30, min: 1, max: 300, step: 0.1, smin: 15, smax: 55 }) +
        UI.num("p", "Khoảng cách màn – thấu kính d′", "cm", { v: 30, min: 1, max: 400, step: 0.1, smin: 10, smax: 80 })) +
      UI.panel("Điều khiển", UI.acts([["rec", "Ghi vào bảng", 1], ["nl", "Đổi thấu kính"]]) + '<div class="msg"></div>') +
      UI.panel("Quan sát", UI.vals([["sh", "Ảnh trên màn", ""], ["dl", "Khoảng cách vật – màn L", "cm"]])),
    below: UI.data(UI.acts([["rv", "Hiện f thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), g = q(".scene").getContext("2d");
  const lg = Log(q(".lg"), ["d (cm)", "d′ (cm)", "d + d′ (cm)", "f = dd′/(d + d′) (cm)"]);
  const newF = () => [10, 12, 15, 20][Math.floor(Math.random() * 4)] + Math.round(gauss() * 5) / 10;
  let f = newF();
  const AY = 150;
  function geom(){ const d = K.v("d"), ok = d > f + 0.5, dt = ok ? d * f / (d - f) : Infinity; return { d, ok, dt, dp: K.v("p") }; }
  function update(){
    const s = geom(), blur = s.ok ? Math.abs(s.dp - s.dt) : 99, sharp = s.ok && blur <= 0.5;
    K.out("sh", !s.ok ? "không có ảnh thật (d ≤ f)" : sharp ? "rõ nét ✓" : blur < 3 ? "hơi nhòe" : "nhòe");
    K.out("dl", (s.d + s.dp).toFixed(1));
    draw(s, blur);
  }
  function draw(s, blur){
    g.clearRect(0, 0, 640, 300);
    const ppc = Math.min(4.2, 590 / (s.d + s.dp + 12));
    let LX = 25 + s.d * ppc; if (LX < 252 && 252 + s.dp * ppc < 625) LX = 252;
    g.strokeStyle = C.muted; g.lineWidth = 1; g.beginPath(); g.moveTo(0, AY); g.lineTo(640, AY); g.stroke();
    const tk = niceStep(Math.max(5, 120 / ppc)) / 2;
    g.fillStyle = C.muted; g.font = F(10);
    for (let c = -Math.floor(LX / ppc / tk) * tk; LX + c * ppc <= 640; c += tk) { const x = LX + c * ppc; g.fillRect(x, AY, 1, 5); g.fillText(+c.toFixed(1), x - 6, AY + 16); }
    g.strokeStyle = C.blue; g.lineWidth = 3; g.beginPath(); g.ellipse(LX, AY, 7, 70, 0, 0, 2 * Math.PI); g.stroke();
    const ox = LX - s.d * ppc, hObj = 36; arrow(g, ox, AY, ox, AY - hObj, C.red, 3);
    g.fillStyle = C.red; g.font = F(11, 600); g.fillText("vật", ox - 8, AY - hObj - 6);
    const sx = LX + s.dp * ppc; g.strokeStyle = C.ink2; g.lineWidth = 4; g.beginPath(); g.moveTo(sx, AY - 80); g.lineTo(sx, AY + 80); g.stroke(); g.fillStyle = C.ink2; g.fillText("màn", sx - 10, AY + 96);
    const tip = { x: ox, y: AY - hObj };
    g.lineWidth = 1; g.strokeStyle = C.red; g.globalAlpha = 0.5;
    [-60, 0, 60].forEach(h => { const yL = AY + h; g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(LX, yL);
      if (s.ok) { const itx = LX + s.dt * ppc, ity = AY + (hObj * s.dt / s.d); const m = (ity - yL) / (itx - LX); g.lineTo(sx, yL + m * (sx - LX)); } else g.lineTo(LX + 200, yL); g.stroke(); });
    g.globalAlpha = 1;
    if (s.ok) {
      const himg = hObj * s.dt / s.d, spot = 1 + blur * 1.1;
      g.save(); g.shadowColor = C.red; g.shadowBlur = Math.min(24, blur * 2.2); g.strokeStyle = C.red; g.lineWidth = 3;
      g.beginPath(); g.moveTo(sx, AY); g.lineTo(sx, AY + clamp(himg, 0, 75)); g.stroke(); g.restore();
      g.fillStyle = C.red; g.globalAlpha = clamp(1 - blur / 8, 0.2, 0.95); g.beginPath(); g.arc(sx, AY + clamp(himg, 0, 75), Math.min(spot, 14), 0, 2 * Math.PI); g.fill(); g.globalAlpha = 1;
    }
    g.fillStyle = C.muted; g.font = F(11); g.fillText("thang chia: cm, gốc tại thấu kính", 10, 290);
  }
  root._redraw = update;
  K.on("*", update);
  function showMean(){ const d = lg.data(); q(".mean").innerHTML = d.length ? "f " + stat(d.map(x => x.f), 2, "cm") : ""; }
  q(".rec").onclick = () => {
    const s = geom(); if (!s.ok) { q(".msg").textContent = "Vật phải đặt xa thấu kính hơn tiêu cự."; return; }
    if (Math.abs(s.dp - s.dt) > 0.5) { q(".msg").textContent = "Ảnh chưa rõ nét: hãy dịch màn (nhập d′) đến khi ảnh sắc nét."; return; }
    q(".msg").textContent = "";
    const dm = rnd(s.d + gauss() * 0.1, 0.1), pm = rnd(s.dp + gauss() * 0.1, 0.1), ff = dm * pm / (dm + pm);
    lg.add([dm.toFixed(1), pm.toFixed(1), (dm + pm).toFixed(1), ff.toFixed(2)], { f: ff }); showMean();
  };
  q(".nl").onclick = () => { f = newF(); lg.clear(); showMean(); q(".tr").textContent = ""; update(); };
  q(".clr").onclick = () => { lg.clear(); showMean(); };
  q(".rv").onclick = () => { const d = lg.data(); q(".tr").innerHTML = '<span class="ok">Tiêu cự thật f = ' + f.toFixed(2) + " cm</span>" + (d.length ? " &nbsp; Sai số tương đối: " + (Math.abs(mean(d.map(x => x.f)) - f) / f * 100).toFixed(1) + " %" : ""); };
  update();
};

MOUNTS.battery = function(root){
  setHTML(root, UI.layout({
    stage:
      '<svg class="circuit" viewBox="0 0 380 230" role="img" aria-label="Sơ đồ mạch đo E và r">' +
      '<g class="w"><path d="M60 60 H120 M240 60 H320 V105 M320 135 V190 H60 V135 M60 105 V60"/>' +
      '<path d="M50 105 H70 M56 115 H64" stroke-width="3"/><path d="M60 115 V135"/>' +

    side:
      UI.panel("Mạch điện",

    below: UI.data('<canvas class="ch" width="560" height="280"></canvas><div class="res fit"></div>' + UI.acts([["rv", "Hiện E, r thật"], ["clr", "Xoá bảng"]]))
  }));
  const K = bind(root), q = s => root.querySelector(s), cv = q(".ch");
  const lg = Log(q(".lg"), ["R (Ω)", "U (V)", "I (A)"]);

  function measure(){
    const i = E / (K.v("R") + r + K.v("RA"));
    U = Math.round((E - i * r + gauss() * 0.003) / 0.01) * 0.01; I = Math.round((i + gauss() * 0.002) / 0.001) * 0.001;

  q(".np").onclick = newBattery;

  q(".rv").onclick = () => { const f = lineFit(lg.data().map(p => ({ x: p.I, y: p.U }))); q(".tr").innerHTML = '<span class="ok">Giá trị thật: E = ' + E.toFixed(3) + " V, r = " + r.toFixed(3) + " Ω</span>" + (f ? "<br>Sai số: ΔE = " + Math.abs(f.a - E).toFixed(3) + " V, Δr = " + Math.abs(-f.b - r).toFixed(3) + " Ω" : ""); };
